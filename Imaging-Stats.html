  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }\n  .srcitem a, .srcitem span.cit { color: var(--ink); }\n  .srcitem a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line-2); }\n  .srcitem a:hover { text-decoration-color: var(--ink); }\n  .srcitem .sd { color: var(--line-2); margin: 0 .3em; }\n  .colophon { margin-top: 40px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .03em; line-height: 1.7; color: var(--ink-3); max-width: 760px; }\n\n  @media (max-width: 720px) {\n    .row { grid-template-columns: 40px 1fr 22px; gap: 12px 14px; }\n    .barcell { grid-column: 1 / -1; order: 5; margin-top: 2px; }\n    .metric { grid-template-columns: 86px 1fr 88px; gap: 10px; }\n    .detail { grid-template-columns: 1fr; }\n    .controls { flex-direction: column; align-items: flex-start; }\n  }\n\n  /* ════════ FIELD AT A GLANCE — exact card spec, scoped to .glance ════════ */\n  .glance { --cream:#F2EDE4; --ink:#1C1A17; --warm-gray:#9C9488; --light-gray:#D6D0C8;\n    --amber:#B07D3A; --rust:#8B3A2F; --dusty-rose:#C97B6E; --slate-blue:#4A6B7C; --rule:1px solid #C8C2B8;\n    font-family:'DM Sans',sans-serif; font-weight:300; font-size:15px; line-height:1.6; color:var(--ink);\n    margin-top: clamp(80px, 11vw, 132px); }\n  .glance *, .glance *::before, .glance *::after { box-sizing:border-box; margin:0; padding:0; }\n  .glance .page-eyebrow { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--warm-gray); margin-bottom:16px; }\n  .glance .page-title { font-family:'Playfair Display',serif; font-size:clamp(36px,5vw,64px); font-weight:400; line-height:1.1; margin-bottom:8px; }\n  .glance .page-title em { font-style:italic; }\n  .glance .page-subtitle { font-size:16px; color:var(--warm-gray); max-width:560px; margin-bottom:72px; line-height:1.7; }\n  .glance .stats-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:2px; }\n  .glance .card { background:var(--cream); border:var(--rule); padding:36px 32px 40px; display:flex; flex-direction:column; gap:16px; position:relative; overflow:hidden; }\n  .glance .span-3{grid-column:span 3;} .glance .span-4{grid-column:span 4;} .glance .span-5{grid-column:span 5;}\n  .glance .span-6{grid-column:span 6;} .glance .span-7{grid-column:span 7;} .glance .span-12{grid-column:span 12;}\n  .glance .card-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--warm-gray); }\n  .glance .card-body { font-size:13.5px; line-height:1.75; color:#3A3730; max-width:480px; }\n  .glance .card-body strong { font-weight:500; color:var(--ink); }\n  .glance .card-source { font-family:'DM Mono',monospace; font-size:10px; color:var(--warm-gray); margin-top:auto; }\n  .glance .card-source a { color:var(--warm-gray); text-decoration:underline; text-underline-offset:3px; }\n  .glance .card-source a:hover { color:var(--ink); }\n  .glance .donut-pair { display:flex; align-items:center; gap:40px; padding:8px 0; }\n  .glance .donut-item { display:flex; flex-direction:column; align-items:center; gap:10px; }\n  .glance .donut-item svg { overflow:visible; }\n  .glance .donut-pct { font-family:'Playfair Display',serif; font-size:18px; font-weight:400; fill:var(--ink); }\n  .glance .donut-sub { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--warm-gray); text-align:center; max-width:130px; line-height:1.6; }\n  .glance .vs { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--light-gray); align-self:center; }\n  .glance .lockup-8in10 { display:flex; align-items:baseline; gap:10px; line-height:1; }\n  .glance .lockup-8in10 .big { font-family:'Playfair Display',serif; font-size:80px; font-weight:400; line-height:1; color:var(--ink); }\n  .glance .lockup-8in10 .fraction-text { font-family:'DM Sans',sans-serif; font-size:22px; font-weight:300; color:var(--warm-gray); }\n  .glance .geo-ratio { font-family:'Playfair Display',serif; font-size:clamp(48px,5vw,72px); font-weight:400; line-height:1; letter-spacing:-0.02em; }\n  .glance .geo-denom { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--warm-gray); margin-top:6px; margin-bottom:20px; }\n  .glance .geo-divider { border:none; border-top:var(--rule); margin:4px 0 16px; }\n  .glance .geo-disparity { list-style:none; display:flex; flex-direction:column; gap:8px; }\n  .glance .geo-disparity li { display:flex; gap:10px; font-size:13px; color:var(--ink); line-height:1.5; }\n  .glance .geo-disparity li::before { content:'—'; color:var(--amber); flex-shrink:0; font-family:'DM Mono',monospace; }\n  .glance .ai-bar-wrap { margin:12px 0 20px; }\n  .glance .ai-bar-labels { display:flex; justify-content:space-between; font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--warm-gray); margin-bottom:5px; }\n  .glance .ai-bar { height:26px; width:100%; border-radius:2px; overflow:hidden; display:flex; }\n  .glance .ai-bar-imaging { width:80%; background:var(--amber); }\n  .glance .ai-bar-other { width:20%; background:var(--light-gray); }\n  .glance .ai-bar-wrap { margin:22px 0 6px; }\n  .glance .ai-bar-labels { margin-top:8px; margin-bottom:0; }\n  /* AI hero — emphasize the 80% share */\n  .glance .ai-hero { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }\n  .glance .ai-pct { font-family:'Playfair Display',serif; font-size:clamp(68px,8.5vw,112px); font-weight:400; line-height:.82; letter-spacing:-0.035em; color:var(--ink); }\n  .glance .ai-cap { font-family:'DM Sans',sans-serif; font-size:14.5px; line-height:1.4; color:var(--ink); max-width:230px; font-weight:300; }\n  .glance .ai-cap strong { color:var(--ink); font-weight:500; }\n  /* shared big-sentence caption — matches the AI 80% treatment */\n  .glance .stat-cap { font-family:'DM Sans',sans-serif; font-size:14.5px; line-height:1.45; color:var(--ink); font-weight:300; margin-top:14px; }\n  .glance .stat-cap strong { color:var(--ink); font-weight:500; }\n  .glance .donut-item .stat-cap { text-align:center; max-width:175px; margin-top:16px; }\n  .glance .wf-count { font-family:'DM Sans',sans-serif; font-size:13.5px; color:var(--warm-gray); text-align:center; margin-top:7px; }\n  .glance .wf-count strong { color:var(--ink); font-weight:600; }\n  /* Geographic — render as an explicit ratio (fraction lockup) */\n  .glance .geo-fraction { display:inline-block; margin:8px 0 2px; }\n  .glance .gf-num { display:flex; align-items:baseline; gap:12px; }\n  .glance .gf-big { font-family:'Playfair Display',serif; font-size:clamp(58px,6.5vw,86px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:var(--ink); }\n  .glance .gf-unit { font-family:'DM Mono',monospace; font-size:13px; letter-spacing:0.07em; text-transform:uppercase; color:var(--amber); }\n  .glance .gf-rule { height:2px; background:var(--ink); margin:9px 0; }\n  .glance .gf-den { font-family:'DM Mono',monospace; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--warm-gray); }\n  .glance .geo-tag { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--warm-gray); margin-top:12px; }\n  .glance .waffle { display:grid; grid-template-columns:repeat(10,10px); gap:3px; }\n  .glance .waffle-sq { width:10px; height:10px; border-radius:1px; }\n  .glance .waffle-legend { display:flex; gap:20px; margin-top:12px; flex-wrap:wrap; }\n  .glance .legend-item { display:flex; align-items:center; gap:6px; font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--warm-gray); }\n  .glance .legend-swatch { width:10px; height:10px; border-radius:1px; flex-shrink:0; }\n  @media (max-width: 900px) {\n    .glance .stats-grid { grid-template-columns:repeat(6,1fr); }\n    .glance .span-3, .glance .span-4, .glance .span-5, .glance .span-6, .glance .span-7 { grid-column:span 6; }\n  }\n  @media (max-width: 560px) {\n    .glance .stats-grid { grid-template-columns:1fr; gap:0; }\n    .glance .span-3, .glance .span-4, .glance .span-5, .glance .span-6, .glance .span-7, .glance .span-12 { grid-column:span 1; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"wrap\">\n\n    <!-- ============ MASTHEAD ============ -->\n    <header class=\"masthead\">\n      <div class=\"eyebrow\">Field Guide<span class=\"sep\">·<\u002Fspan>United States<span class=\"sep\">·<\u002Fspan>Annual Figures<\u002Fdiv>\n      <h1 class=\"title\">Eleven Ways to <span class=\"it\">See Inside<\u002Fspan> the Body<\u002Fh1>\n      <p class=\"dek\">Every routine medical imaging type in the U.S., ranked by how <span class=\"serif it\">often<\u002Fspan> it is performed — or, with one tap, by what it <span class=\"serif it\">costs<\u002Fspan>. The most common scans tend to be the cheapest; the rarest, the most expensive. Read the table top-to-bottom and watch the bars trade places.<\u002Fp>\n      <hr class=\"rule\">\n    <\u002Fheader>\n\n    <!-- ============ CONTROLS : tiny hint + sort toggle ============ -->\n    <div class=\"controls\">\n      <div class=\"legend\">\n        <span class=\"lk\">The metric you rank by leads each row — the other figure dims<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"toggle\" role=\"group\" aria-label=\"Sort order\">\n        <button id=\"sort-vol\" aria-pressed=\"true\"><span class=\"dot\"><\u002Fspan>By volume<\u002Fbutton>\n        <button id=\"sort-cost\" aria-pressed=\"false\"><span class=\"dot\"><\u002Fspan>By cost<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ TABLE ============ -->\n    <div class=\"count\" id=\"count\">All 11 imaging types · ranked by annual volume<\u002Fdiv>\n    <div class=\"table\" id=\"table\"><\u002Fdiv>\n\n    <p class=\"method\"><b>Method.<\u002Fb> Each row shows a representative annual U.S. figure with its source. Volumes are drawn from different years and definitions, so the ranking is indicative, not exact. <b>Average cost<\u002Fb> is the typical billed price; what a patient pays depends on insurance, facility, and geography. Four modalities — fluoroscopy, DEXA, SPECT, and angiography — are <b>left blank<\u002Fb> where a representative average price was not available.<\u002Fp>\n\n    <!-- ============ FIELD AT A GLANCE ============ -->\n    <!-- ============ FIELD AT A GLANCE (exact spec) ============ -->\n    <section class=\"glance\">\n      <p class=\"page-eyebrow\">Radiology in the United States<\u002Fp>\n      <h2 class=\"page-title\">The field,<br><em>at a glance.<\u002Fem><\u002Fh2>\n      <p class=\"page-subtitle\">\n        Every number below reflects a gap — between the scale of diagnostic imaging\n        and the workforce that reads it, the access patients have, and the margin\n        of error they carry without knowing it.\n      <\u002Fp>\n\n      <div class=\"stats-grid\">\n\n        <!-- ── ROW 1 · WORKFORCE (span 7) ──────────────────────── -->\n        <div class=\"card span-7\">\n          <div class=\"donut-pair\">\n            <div class=\"donut-item\">\n              <svg width=\"150\" height=\"150\" viewBox=\"0 0 110 110\">\n                <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"none\" stroke=\"#D6D0C8\" stroke-width=\"14\"><\u002Fcircle>\n                <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"none\" stroke=\"#B07D3A\" stroke-width=\"14\" stroke-dasharray=\"8.7 255.2\" stroke-linecap=\"butt\" transform=\"rotate(-90 55 55)\"><\u002Fcircle>\n                <text x=\"55\" y=\"64\" text-anchor=\"middle\" class=\"donut-pct\" font-size=\"26\">3.3%<\u002Ftext>\n              <\u002Fsvg>\n              <p class=\"stat-cap\">of all U.S. physicians are <strong>radiologists<\u002Fstrong><\u002Fp>\n              <p class=\"wf-count\"><strong>34,512<\u002Fstrong> of 1,032,365 physicians<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"vs\">vs.<\u002Fdiv>\n            <div class=\"donut-item\">\n              <svg width=\"150\" height=\"150\" viewBox=\"0 0 110 110\">\n                <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"none\" stroke=\"#D6D0C8\" stroke-width=\"14\"><\u002Fcircle>\n                <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"none\" stroke=\"#B07D3A\" stroke-width=\"14\" stroke-dasharray=\"23.4 240.5\" stroke-linecap=\"butt\" transform=\"rotate(-90 55 55)\"><\u002Fcircle>\n                <text x=\"55\" y=\"64\" text-anchor=\"middle\" class=\"donut-pct\" font-size=\"26\">8.85%<\u002Ftext>\n              <\u002Fsvg>\n              <p class=\"stat-cap\">of all U.S. health spending is <strong>medical imaging<\u002Fstrong><\u002Fp>\n              <p class=\"wf-count\"><strong>$66.19B<\u002Fstrong> of $748.15B spent<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"card-source\">\n            AAMC 2024 ·\n            <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10986240/\" target=\"_blank\">Horny et al. (2024)<\u002Fa>\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ── ROW 1 · SCAN VOLUME (span 5) ────────────────────── -->\n        <div class=\"card span-5\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:clamp(52px,5vw,80px);font-weight:400;line-height:1;letter-spacing:-0.03em;color:var(--ink);\">607M<\u002Fdiv>\n          <p class=\"stat-cap\">scans performed in the U.S. <strong>every year<\u002Fstrong> — about <strong>1.8 per person<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ── ROW 2 · HOSPITAL VISITS (span 5) ────────────────── -->\n        <div class=\"card span-5\">\n          <div class=\"lockup-8in10\">\n            <span class=\"big\">8<\u002Fspan>\n            <span class=\"fraction-text\">in 10<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"stat-cap\">\n            Of all hospital visits in the U.S., <strong>8 in 10<\u002Fstrong> involve\n            some form of diagnostic imaging.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ── ROW 2 · AI / MACHINE LEARNING (span 7) ──────────── -->\n        <div class=\"card span-7\">\n          <div class=\"ai-hero\">\n            <span class=\"ai-pct\">80%<\u002Fspan>\n            <span class=\"ai-cap\">of <strong>every AI-enabled device the FDA has cleared<\u002Fstrong> is for imaging<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ai-bar-wrap\">\n            <div class=\"ai-bar\">\n              <div class=\"ai-bar-imaging\"><\u002Fdiv>\n              <div class=\"ai-bar-other\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ai-bar-labels\">\n              <span>1,039 imaging devices<\u002Fspan>\n              <span>all other AI · ~20%<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"card-source\">\n            <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0720048X18302250\" target=\"_blank\">Fazal et al. (2018)<\u002Fa> ·\n            <a href=\"https://radiologybusiness.com/topics/artificial-intelligence/dozens-new-ai-powered-devices-make-fdas-list-approvals\" target=\"_blank\">Radiology Business<\u002Fa>\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ── ROW 3 · ERROR RATE (span 5) ─────────────────────── -->\n        <div class=\"card span-5\">\n          <div class=\"waffle\" id=\"waffle\"><\u002Fdiv>\n          <div class=\"waffle-legend\">\n            <div class=\"legend-item\">\n              <div class=\"legend-swatch\" style=\"background:var(--rust);\"><\u002Fdiv>\n              Real-time error · 3–5%\n            <\u002Fdiv>\n            <div class=\"legend-item\">\n              <div class=\"legend-swatch\" style=\"background:var(--dusty-rose);\"><\u002Fdiv>\n              In hindsight · ~30%\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"stat-cap\" style=\"margin-top:8px;\">About <strong>40 million<\u002Fstrong> real-time errors a year, worldwide.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ── ROW 3 · GEOGRAPHIC ACCESS (span 7) ──────────────── -->\n        <div class=\"card span-7\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:clamp(58px,6.5vw,86px);font-weight:400;line-height:1;letter-spacing:-0.02em;color:var(--ink);\">0.305<\u002Fdiv>\n          <p class=\"stat-cap\">interventional radiologists for <strong>every 100,000 people<\u002Fstrong>, on average.<\u002Fp>\n          <hr class=\"geo-divider\">\n          <ul class=\"geo-disparity\">\n            <li>Concentrated near cities — rural counties are largely unserved<\u002Fli>\n            <li>Higher radiologist density correlates with higher county income<\u002Fli>\n            <li>Access tracks educational attainment, not medical need<\u002Fli>\n          <\u002Ful>\n          <p class=\"card-source\">\n            <a href=\"https://www.jvir.org/article/S1051-0443(23)00789-3/abstract\" target=\"_blank\">Ahmad et al. (2024)<\u002Fa>\n          <\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv><!-- /stats-grid -->\n    <\u002Fsection>\n\n    <!-- ============ SOURCES ============ -->\n    <section class=\"sources\">\n      <h3>Sources &amp; Citations<\u002Fh3>\n      <div class=\"srcgrid\">\n        <div class=\"srcitem\"><div class=\"st\">X-Ray<\u002Fdiv><span class=\"cit\">Mahesh et al. (2024)<\u002Fspan><span class=\"sd\">·<\u002Fspan>NYT<span class=\"sd\">·<\u002Fspan>KFF Health News<\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">CT Scan<\u002Fdiv><span class=\"cit\">NIH (2023)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Ultrasound<\u002Fdiv><span class=\"cit\">Won et al. (2024)<\u002Fspan><span class=\"sd\">·<\u002Fspan>UNC Global Health<\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">MRI<\u002Fdiv><span class=\"cit\">Statista<\u002Fspan><span class=\"sd\">·<\u002Fspan>Shah &amp; Aran (2023)<span class=\"sd\">·<\u002Fspan>UC Berkeley<\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Mammography<\u002Fdiv><span class=\"cit\">FDA (2025)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Endoscopy<\u002Fdiv><span class=\"cit\">Peery et al. (2022)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Fluoroscopy<\u002Fdiv><span class=\"cit\">IAEA<\u002Fspan><span class=\"sd\">·<\u002Fspan>ORSIF<\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">DEXA Scan<\u002Fdiv><span class=\"cit\">Prout et al. (2019)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">SPECT Scan<\u002Fdiv><span class=\"cit\">UPenn<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Angiography<\u002Fdiv><span class=\"cit\">Stefanini &amp; Windecker (2015)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">PET Scan<\u002Fdiv><span class=\"cit\">Mettler et al. (2020)<\u002Fspan><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Workforce &amp; Spending<\u002Fdiv>AAMC (2024)<span class=\"sd\">·<\u002Fspan><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10986240/\" target=\"_blank\" rel=\"noopener\">Horny et al. (2024)<\u002Fa><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">AI in Radiology<\u002Fdiv><a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0720048X18302250\" target=\"_blank\" rel=\"noopener\">Fazal et al. (2018)<\u002Fa><span class=\"sd\">·<\u002Fspan><a href=\"https://radiologybusiness.com/topics/artificial-intelligence/dozens-new-ai-powered-devices-make-fdas-list-approvals\" target=\"_blank\" rel=\"noopener\">Radiology Business<\u002Fa><\u002Fdiv>\n        <div class=\"srcitem\"><div class=\"st\">Access Disparities<\u002Fdiv><a href=\"https://www.jvir.org/article/S1051-0443(23)00789-3/abstract\" target=\"_blank\" rel=\"noopener\">Ahmad et al. (2024)<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"colophon\">An open-source reference compiled for public understanding of diagnostic imaging in the United States. Every figure on this page is drawn directly from the cited sources above; no values are estimated or interpolated. Bar lengths are scaled for visual comparison only.<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <script>\n  (function () {\n    /* ---------------- DATA ---------------------------------------------------\n       volume  : numeric (millions) — for ranking + bar length only\n       volDisp : exact label shown on the bar\n       cost    : numeric (USD) — for ranking + bar length only; null = blank\n       costDisp: exact label shown on the bar; null = blank\n       Every displayed number comes straight from the supplied figures.\n    ------------------------------------------------------------------------- */\n    var DATA = [\n      { key:\"xray\", name:\"X-Ray\", cat:\"radio\",\n        volume:275, volDisp:\"275M / yr\",\n        cost:212, costDisp:\"$125–$300\",\n        volNote:\"275 million conventional radiology procedures (2016). Some sources cite this as 275 million medical X-ray exams. Separately: 8.1M interventional and 320M dental procedures.\",\n        costRange:\"Range $50 – $1,000+\",\n        note:\"The oldest and most common image in medicine — a shadow cast by bone and tissue. Fast, cheap, and nearly everywhere.\",\n        sources:[ {t:\"Mahesh et al. (2024)\"}, {t:\"NYT\"}, {t:\"KFF Health News\"} ] },\n\n      { key:\"ct\", name:\"CT Scan\", cat:\"tomo\",\n        volume:93, volDisp:\"93M / yr\",\n        cost:3275, costDisp:\"$3,275\",\n        volNote:\"93 million scans in 2023.\",\n        costRange:\"Range $300 – $6,750\",\n        note:\"X-rays reconstructed into cross-sections, like a loaf of bread sliced thin. The emergency department's workhorse.\",\n        sources:[ {t:\"NIH (2023)\"} ] },\n\n      { key:\"us\", name:\"Ultrasound\", cat:\"sono\",\n        volume:59.8, volDisp:\"59.8M / yr\",\n        cost:410, costDisp:\"~$410\",\n        volNote:\"59.8 million in 2021, including 12 million+ pregnancy-related ultrasounds.\",\n        costRange:\"Range $100 – $1,000+\",\n        note:\"Sound waves returning as a live, moving picture — no radiation, no tube. Safe for pregnancy and portable to the bedside.\",\n        sources:[ {t:\"Won et al. (2024)\"}, {t:\"UNC Global Health\"} ] },\n\n      { key:\"mammo\", name:\"Mammography\", cat:\"radio\",\n        volume:43, volDisp:\"43M / yr\",\n        cost:234, costDisp:\"~$234\",\n        volNote:\"43 million as of 2025.\",\n        costRange:\"~$234 out-of-pocket for 2D · Range $100 – $600 (2D/3D)\",\n        note:\"Dedicated breast-cancer screening, delivered mostly on a recurring schedule for women over 40.\",\n        sources:[ {t:\"FDA (2025)\"} ] },\n\n      { key:\"mri\", name:\"MRI\", cat:\"mag\",\n        volume:37.98, volDisp:\"37.98M / yr\",\n        cost:1325, costDisp:\"~$1,325\",\n        volNote:\"37.98 million, cross-referenced as 'nearly 40 million.'\",\n        costRange:\"Range $400 – $12,000\",\n        note:\"No radiation at all — powerful magnets reading the water inside you. Unmatched soft-tissue detail.\",\n        sources:[ {t:\"Statista\"}, {t:\"Shah & Aran (2023)\"}, {t:\"UC Berkeley\"} ] },\n\n      { key:\"fluoro\", name:\"Fluoroscopy\", cat:\"radio\",\n        volume:24, volDisp:\"24M / yr\",\n        cost:null, costDisp:null,\n        volNote:\"24 million as of 2020.\",\n        costRange:null,\n        note:\"Real-time, moving X-ray. It usually supports GI studies, catheterizations, and orthopedic work rather than billing on its own.\",\n        sources:[ {t:\"IAEA\"}, {t:\"ORSIF\"} ] },\n\n      { key:\"endo\", name:\"Endoscopy\", cat:\"endo\",\n        volume:22.2, volDisp:\"22.2M / yr\",\n        cost:2750, costDisp:\"~$2,750\",\n        volNote:\"22.2 million GI endoscopies as of 2021; broader counts range from 50+ to 75 million across all types.\",\n        costRange:\"Range $1,500 – $10,000\",\n        note:\"A camera threaded into the body to look directly at tissue. GI procedures dominate the count.\",\n        sources:[ {t:\"Peery et al. (2022)\"} ] },\n\n      { key:\"spect\", name:\"SPECT Scan\", cat:\"nuc\",\n        volume:8, volDisp:\"8M / yr\",\n        cost:null, costDisp:null,\n        volNote:\"8 million cardiac SPECT scans.\",\n        costRange:null,\n        note:\"Nuclear imaging, largely cardiac — a radiotracer mapped by a rotating gamma camera.\",\n        sources:[ {t:\"UPenn\"} ] },\n\n      { key:\"dexa\", name:\"DEXA Scan\", cat:\"radio\",\n        volume:2.7, volDisp:\"2.7M / yr\",\n        cost:null, costDisp:null,\n        volNote:\"2.7 million as of 2019.\",\n        costRange:null,\n        note:\"Low-dose dual-energy X-ray for bone density, driven by osteoporosis screening in older adults.\",\n        sources:[ {t:\"Prout et al. (2019)\"} ] },\n\n      { key:\"pet\", name:\"PET Scan\", cat:\"nuc\",\n        volume:1.9, volDisp:\"1.9M / yr\",\n        cost:3155, costDisp:\"~$1,711–$4,600+\",\n        volNote:\"1.9 million PET/CT as of 2016.\",\n        costRange:\"Range $1,300 – $12,848\",\n        note:\"A radioactive tracer lights up cells by how hungrily they burn sugar. The rarest routine scan — and the most expensive.\",\n        sources:[ {t:\"Mettler et al. (2020)\"} ] },\n\n      { key:\"angio\", name:\"Angiography\", cat:\"radio\",\n        volume:1, volDisp:\"1M / yr\",\n        cost:null, costDisp:null,\n        volNote:\"1 million invasive coronary angiography as of 2014.\",\n        costRange:null,\n        note:\"Invasive vascular imaging that maps blood vessels, often paired with treatment in the same sitting.\",\n        sources:[ {t:\"Stefanini & Windecker (2015)\"} ] }\n    ];\n\n    var CAT = {\n      radio:{ label:\"Radiography\",  color:\"var(--c-radio)\" },\n      tomo: { label:\"Tomography\",   color:\"var(--c-tomo)\"  },\n      sono: { label:\"Sonography\",   color:\"var(--c-sono)\"  },\n      mag:  { label:\"Magnetic\",     color:\"var(--c-mag)\"   },\n      nuc:  { label:\"Nuclear\",      color:\"var(--c-nuc)\"   },\n      endo: { label:\"Endoscopy\",    color:\"var(--c-endo)\"  }\n    };\n\n    // sqrt scaling (matches the gentle proportions of an editorial chart)\n    var maxVolSq  = Math.sqrt(Math.max.apply(null, DATA.map(function(d){return d.volume;})));\n    var costVals  = DATA.filter(function(d){return d.cost!=null;}).map(function(d){return d.cost;});\n    var maxCostSq = Math.sqrt(Math.max.apply(null, costVals));\n    function barVol(v){ return Math.max(6, (Math.sqrt(v)/maxVolSq)*100); }\n    function barCost(c){ return c==null ? 0 : Math.max(6, (Math.sqrt(c)/maxCostSq)*100); }\n\n    var state = { sort:\"vol\", open:{} };\n\n    function ordered() {\n      var list = DATA.slice();\n      if (state.sort === \"vol\") {\n        list.sort(function(a,b){\n          if (b.volume !== a.volume) return b.volume - a.volume;\n          return (b.cost||0) - (a.cost||0);\n        });\n      } else {\n        list.sort(function(a,b){\n          var ac = a.cost==null, bc = b.cost==null;\n          if (ac && bc) return b.volume - a.volume;   // blanks: keep busiest first\n          if (ac) return 1;                           // blanks sink to the bottom\n          if (bc) return -1;\n          if (b.cost !== a.cost) return b.cost - a.cost;\n          return b.volume - a.volume;\n        });\n      }\n      return list;\n    }\n\n    var tableEl = document.getElementById(\"table\");\n    var countEl = document.getElementById(\"count\");\n\n    function render() {\n      var list = ordered();\n      countEl.textContent = state.sort === \"vol\"\n        ? \"All 11 imaging types · ranked by annual volume\"\n        : \"All 11 imaging types · ranked by average cost · blanks last\";\n\n      tableEl.innerHTML = \"\";\n      list.forEach(function (d, i) {\n        var c = CAT[d.cat];\n        var isOpen = !!state.open[d.key];\n\n        var row = document.createElement(\"div\");\n        row.className = \"row\" + (isOpen ? \" open\" : \"\");\n        row.setAttribute(\"data-screen-label\", d.name);\n\n        var costVal = d.costDisp\n          ? '<span class=\"mval\">'+d.costDisp+'<\u002Fspan>'\n          : '<span class=\"mval blank\">—<\u002Fspan>';\n\n        var volActive  = state.sort === \"vol\";\n        var volMetric =\n          '<div class=\"metric vol ' + (volActive ? 'active' : 'dim') + '\">' +\n            '<span class=\"mlbl\">Annual volume<\u002Fspan>' +\n            '<span class=\"track\"><span class=\"fill\" style=\"width:'+barVol(d.volume)+'%\"><\u002Fspan><\u002Fspan>' +\n            '<span class=\"mval\">'+d.volDisp+'<\u002Fspan>' +\n          '<\u002Fdiv>';\n        var costMetric =\n          '<div class=\"metric cost ' + (volActive ? 'dim' : 'active') + '\">' +\n            '<span class=\"mlbl\">Avg cost<\u002Fspan>' +\n            '<span class=\"track\"><span class=\"fill\" style=\"width:'+barCost(d.cost)+'%\"><\u002Fspan><\u002Fspan>' +\n            costVal +\n          '<\u002Fdiv>';\n        // the metric you rank by leads; the other dims beneath it\n        var metrics = volActive ? (volMetric + costMetric) : (costMetric + volMetric);\n\n        row.innerHTML =\n          '<div class=\"rk\">' + (i+1) + '<\u002Fdiv>' +\n          '<div class=\"namecell\">' +\n            '<div class=\"name\">' + d.name + '<\u002Fdiv>' +\n            '<div class=\"cat\"><span class=\"mtag\">M<\u002Fspan><span class=\"lbl\">'+c.label+'<\u002Fspan><\u002Fdiv>' +\n          '<\u002Fdiv>' +\n          '<div class=\"barcell\">' + metrics + '<\u002Fdiv>' +\n          '<svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M3.5 6l4.5 4.5L12.5 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>';\n\n        var det = document.createElement(\"div\");\n        det.className = \"detail\" + (isOpen ? \" open\" : \"\");\n        var srcHtml = d.sources.map(function(s){\n          return s.href ? '<a href=\"'+s.href+'\" target=\"_blank\" rel=\"noopener\">'+s.t+'<\u002Fa>' : '<span>'+s.t+'<\u002Fspan>';\n        }).join('<span class=\"dot\">·<\u002Fspan>');\n        det.innerHTML =\n          '<div><\u002Fdiv>' +\n          '<div class=\"body\">' +\n            '<p class=\"note\">' + d.note + '<\u002Fp>' +\n            '<div class=\"facts\">' +\n              '<div class=\"f\"><div class=\"k\">Annual volume<\u002Fdiv><div class=\"val\">'+d.volNote+'<\u002Fdiv><\u002Fdiv>' +\n              (d.costRange ? '<div class=\"f\"><div class=\"k\">Cost<\u002Fdiv><div class=\"val\">'+d.costRange+'<\u002Fdiv><\u002Fdiv>'\n                           : '<div class=\"f\"><div class=\"k\">Cost<\u002Fdiv><div class=\"val\">Representative average not available<\u002Fdiv><\u002Fdiv>') +\n            '<\u002Fdiv>' +\n            '<div class=\"srcline\"><span class=\"lab\">Source &nbsp;<\u002Fspan>' + srcHtml + '<\u002Fdiv>' +\n          '<\u002Fdiv>';\n\n        row.addEventListener(\"click\", function () {\n          state.open[d.key] = !state.open[d.key];\n          render();\n        });\n\n        tableEl.appendChild(row);\n        tableEl.appendChild(det);\n      });\n    }\n\n    // sort toggle\n    var bVol = document.getElementById(\"sort-vol\");\n    var bCost = document.getElementById(\"sort-cost\");\n    function setSort(mode){\n      state.sort = mode;\n      bVol.setAttribute(\"aria-pressed\",  mode===\"vol\"  ? \"true\":\"false\");\n      bCost.setAttribute(\"aria-pressed\", mode===\"cost\" ? \"true\":\"false\");\n      render();\n    }\n    bVol.addEventListener(\"click\", function(){ setSort(\"vol\"); });\n    bCost.addEventListener(\"click\", function(){ setSort(\"cost\"); });\n\n    // waffle grid (Diagnostic accuracy): 4 real-time (rust) inside 30 retrospective (rose)\n    (function buildWaffle(){\n      var waffle = document.getElementById(\"waffle\");\n      if (!waffle) return;\n      var TOTAL = 100, RUST_COUNT = 4, ROSE_COUNT = 26; // 4 rust + 26 rose = ~30 hindsight\n      for (var k = 0; k < TOTAL; k++) {\n        var sq = document.createElement(\"div\");\n        sq.className = \"waffle-sq\";\n        sq.style.background = k < RUST_COUNT ? \"var(--rust)\"\n                            : (k < RUST_COUNT + ROSE_COUNT ? \"var(--dusty-rose)\" : \"var(--light-gray)\");\n        waffle.appendChild(sq);\n      }\n    })();\n\n    render();\n  })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
