<script>
window.RAD = (function(){
  const LANES = [
    { id:"patient",   name:"Patient",      cls:"lane-patient" },
    { id:"pcp",       name:"Primary Care", cls:"lane-pcp" },
    { id:"insurance", name:"Insurance",    cls:"lane-insurance" },
    { id:"radiology", name:"Radiology",    cls:"lane-radiology" },
  ];

  // Day 1 == 2026-01-01 (Excel serial 46023)
  const START = new Date(2026,0,1);

  // events: day, lane, title (short), desc (full), seen (front-stage vs behind the scenes)
  const EVENTS = [
    { day:1,  lane:"patient",   title:"Notices the pain", seen:true,
      desc:"“Should I be worried? I’ll give it a week.” Googling symptoms, scared about the cost." },
    { day:8,  lane:"patient",   title:"Decides to call", seen:true,
      desc:"Still bothering me — I’m going to reach out to my doctor." },
    { day:8,  lane:"pcp",       title:"Appointment scheduled", seen:false,
      desc:"The practice books the patient into the first available slot." },
    { day:9,  lane:"patient",   title:"Pain starts to ease", seen:true, arrow:true,
      desc:"Pain decreasing — but the appointment is already weeks away." },

    { day:39, lane:"patient",   title:"First PCP appointment", seen:true,
      desc:"The first available appointment with the primary care provider finally arrives." },
    { day:39, lane:"pcp",       title:"Examines the patient", seen:false,
      desc:"Checks insurance eligibility, then assesses symptoms, reviews history and performs a physical exam. Determines that imaging is needed — but has to check with insurance first." },
    { day:39, lane:"insurance", title:"Eligibility check", seen:false,
      desc:"Same-day plan check: a benefit inquiry confirms the policy is active and determines financial responsibility (deductibles and copays)." },

    { day:46, lane:"insurance", title:"Prior-auth decision", seen:false,
      desc:"Insurance returns its decision on the prior authorization request. If documentation is incomplete or more clinical detail is needed, there are further delays." },

    { day:47, lane:"pcp",       title:"Orders the imaging", seen:false,
      desc:"With authorization in hand, the PCP places the imaging order." },
    { day:47, lane:"radiology", title:"Order received", seen:false,
      desc:"The order is transmitted to the imaging center; the scheduling department receives it." },

    { day:48, lane:"patient",   title:"Calls to schedule", seen:true,
      desc:"Patient calls the imaging center to make an appointment." },
    { day:48, lane:"radiology", title:"Appointment scheduled", seen:false,
      desc:"The imaging center books the scan into its first open slot." },

    { day:61, lane:"patient",   title:"Prepares for imaging", seen:true,
      desc:"Follows prep instructions — for example, fasting before the scan." },

    { day:62, lane:"patient",   title:"Imaging day", seen:true,
      desc:"The first available imaging appointment." },
    { day:62, lane:"insurance", title:"Verified again", seen:false,
      desc:"Insurance is verified one more time before the scan proceeds." },
    { day:62, lane:"radiology", title:"Imaging performed", seen:false,
      desc:"Patient prep (contrast dye, positioning, consent), then the imaging is performed." },

    { day:63, lane:"radiology", title:"Reads the images", seen:false,
      desc:"The radiologist analyzes the images and writes the report." },

    { day:64, lane:"patient",   title:"Result notification", seen:true,
      desc:"Receives a notification in the patient portal and schedules the next available appointment with the PCP." },
    { day:64, lane:"pcp",       title:"Receives the report", seen:false,
      desc:"The report arrives; a follow-up appointment is scheduled." },
    { day:64, lane:"radiology", title:"Report finalized", seen:false,
      desc:"Report finalized and submitted." },

    { day:70, lane:"pcp",       title:"Reviews findings", seen:false,
      desc:"The PCP reviews the report findings ahead of the visit." },

    { day:71, lane:"patient",   title:"Returns to the PCP", seen:true,
      desc:"Patient returns to the primary care provider for the results." },
    { day:71, lane:"pcp",       title:"Explains the results", seen:false,
      desc:"Explains the results and discusses next steps." },
  ];

  // waiting periods that fill the gaps — start/end inclusive
  const BANDS = [
    { start:2,  end:7,  lane:"patient",   label:"Waiting it out",
      note:"“I’ll give it a week.” Hoping it passes on its own." },
    { start:10, end:38, lane:"patient",   label:"Waiting for the first available appointment",
      note:"Nearly a month before the first open primary-care slot. The pain often fades before you’re ever seen." },
    { start:40, end:45, lane:"insurance", label:"Prior authorization under review",
      note:"Behind the scenes, insurance reviews the request — before any scan can be booked." },
    { start:49, end:60, lane:"patient",   label:"Waiting for the imaging appointment",
      note:"The first available imaging slot is weeks out." },
    { start:65, end:69, lane:"pcp",       label:"Report waits to be reviewed",
      note:"The finalized report sits in the queue until the PCP reviews it." },
    { start:72, end:79, lane:"patient",   label:"Living with the answer",
      note:"Following the plan discussed with the primary care provider." },
  ];

  // running "what you'll need" list — unlocks as the days pass
  const CHECKLIST = [
    { day:1,  text:"Notes on your symptoms",            detail:"When it started, what makes it better or worse." },
    { day:2,  text:"Insurance card",                    detail:"Member ID and group number on hand." },
    { day:3,  text:"Request time off work",             detail:"You’ll need it for several appointments." },
    { day:39, text:"Medical history & medications",     detail:"Bring a current list to the primary-care visit." },
    { day:39, text:"Photo ID & copay",                  detail:"Payment for the visit." },
    { day:47, text:"Prior-authorization number",        detail:"Confirm imaging is approved before you go." },
    { day:48, text:"Arrange transportation",            detail:"Especially if contrast or sedation is involved." },
    { day:61, text:"Follow prep instructions",          detail:"Fasting or other prep before the scan." },
    { day:62, text:"Comfortable clothes, no metal",     detail:"Plus the consent form for the imaging visit." },
    { day:64, text:"Check the patient portal",          detail:"Results may post before your visit." },
    { day:71, text:"Questions for your follow-up",      detail:"Write them down before you go." },
  ];

  // phase label for the HUD
  const PHASES = [
    { from:1,  to:7,  name:"Should I worry?" },
    { from:8,  to:38, name:"Waiting to be seen" },
    { from:39, to:45, name:"At the doctor" },
    { from:46, to:48, name:"Authorized & ordered" },
    { from:49, to:60, name:"Waiting for imaging" },
    { from:61, to:64, name:"Imaging" },
    { from:65, to:71, name:"Results" },
    { from:72, to:79, name:"Living with the answer" },
  ];

  const TOTAL_DAYS = 79;
  return { LANES, EVENTS, BANDS, CHECKLIST, PHASES, TOTAL_DAYS, START };
})();
</script>

`;

/* ----------------------------------------------------------- helpers --- */
const laneById = Object.fromEntries(LANES.map(l => [l.id, l]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WK = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dateForDay(d){ const dt = new Date(START); dt.setDate(dt.getDate() + (d-1)); return dt; }
function fmtDate(d){ const dt = dateForDay(d); return MONTHS[dt.getMonth()] + " " + dt.getDate(); }
function phaseFor(day){ const p = PHASES.find(p => day>=p.from && day<=p.to); return p ? p.name : ""; }
function weekOf(day){ return Math.floor((day-1)/7) + 1; }

// build ordered segments that partition days 1..TOTAL_DAYS
function buildSegments(){
  const evByDay = {};
  EVENTS.forEach(e => { (evByDay[e.day] = evByDay[e.day] || []).push(e); });
  const bandByStart = {};
  BANDS.forEach(b => { bandByStart[b.start] = b; });
  const segs = [];
  let day = 1;
  while (day <= TOTAL_DAYS){
    if (bandByStart[day]){ const b = bandByStart[day]; segs.push({ type:"band", ...b }); day = b.end + 1; }
    else if (evByDay[day]){ segs.push({ type:"day", day, events: evByDay[day] }); day++; }
    else { day++; }
  }
  return segs;
}

/* ----------------------------------------------------------- EventCard --- */
function EventCard({ ev, laneIndex, active }){
  const lane = laneById[ev.lane];
  const side = laneIndex >= 2 ? "right" : "left";
  return (
    <div className={`card ${lane.cls} ${active ? "" : "dimmed"}`} tabIndex={0}>
      <div className="ctitle">
        {ev.title}{ev.arrow && <span className="arrow"> ↓</span>}
      </div>
      <div className="ctag">
        <span>{lane.name}</span>
        {!ev.seen && <span className="bts">· behind the scenes</span>}
      </div>
      <div className={`pop ${side}`}>
        <div className="pday">Day {ev.day} · {fmtDate(ev.day)}</div>
        {ev.desc}
      </div>
    </div>
  );
}

/* ----------------------------------------------------------- Segment --- */
function DayBlock({ seg, activeLanes }){
  const dt = dateForDay(seg.day);
  return (
    <div className="seg" data-day={seg.day}>
      <div className="rail dayblock">
        <div className="dnum mono">DAY {seg.day}</div>
        <div className="ddate mono">{WK[dt.getDay()]} · {fmtDate(seg.day)}</div>
      </div>
      {LANES.map((lane, i) => {
        const ev = seg.events.find(e => e.lane === lane.id);
        return (
          <div className="cell dayblock" key={lane.id}>
            {ev && <EventCard ev={ev} laneIndex={i} active={activeLanes.has(lane.id)} />}
          </div>
        );
      })}
    </div>
  );
}

function WaitBand({ seg, activeLanes }){
  const lane = laneById[seg.lane];
  const n = seg.end - seg.start + 1;
  const h = Math.max(96, Math.min(322, n * 11));
  const active = activeLanes.has(seg.lane);
  return (
    <div className="seg" data-band-start={seg.start} data-band-end={seg.end}>
      <div className="rail band" style={{ minHeight: h }}>
        <div className="dnum mono">DAY {seg.start}</div>
        <div className="ddate mono">↓ {seg.end}</div>
      </div>
      <div className={`bandcell ${lane.cls}`}>
        <div className={`band ${active ? "" : "dimmed"}`} style={{ minHeight: h }}>
          <div className="hourglass">{lane.name} · waiting</div>
          <div className="bdays mono">{n} {n === 1 ? "DAY" : "DAYS"} PASS</div>
          <div className="blabel">{seg.label}</div>
          <div className="bnote">{seg.note}</div>
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------- Checklist --- */
function Checklist({ currentDay }){
  const [checked, setChecked] = useState(() => CHECKLIST.map(() => false));
  const prevUnlocked = useRef(0);
  const [justIdx, setJustIdx] = useState(-1);

  const unlockedCount = CHECKLIST.filter(c => currentDay >= c.day).length;
  useEffect(() => {
    if (unlockedCount > prevUnlocked.current){
      setJustIdx(unlockedCount - 1);
      const t = setTimeout(() => setJustIdx(-1), 1200);
      prevUnlocked.current = unlockedCount;
      return () => clearTimeout(t);
    }
    prevUnlocked.current = unlockedCount;
  }, [unlockedCount]);

  const toggle = (i) => setChecked(c => { const n = [...c]; n[i] = !n[i]; return n; });

  return (
    <div className="checklist">
      <div className="chead">
        <h3>What you’ll need</h3>
        <span className="cnt mono">{unlockedCount} / {CHECKLIST.length}</span>
      </div>
      <p className="csub">A running list — items appear as the days go by. Tick them off as you go.</p>
      <ul className="items">
        {CHECKLIST.map((c, i) => {
          const unlocked = currentDay >= c.day;
          const isChecked = checked[i] && unlocked;
          return (
            <li key={i}
              className={`item ${unlocked ? "" : "locked"} ${isChecked ? "checked" : ""} ${justIdx === i ? "justunlocked" : ""}`}>
              <div className="box" onClick={() => unlocked && toggle(i)} role="checkbox" aria-checked={isChecked}>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <div className="it-main">
                <div className="it-text">{c.text}</div>
                {unlocked
                  ? <div className="it-detail">{c.detail}</div>
                  : <div className="it-day mono">Unlocks · Day {c.day}</div>}
              </div>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

/* ----------------------------------------------------------- App --- */
function App(){
  const segments = useMemo(buildSegments, []);
  const [activeLanes, setActiveLanes] = useState(() => new Set(LANES.map(l => l.id)));
  const [currentDay, setCurrentDay] = useState(1);

  const kickRef = useRef(null);

  const computeDay = useCallback(() => {
    const refY = window.innerHeight * 0.34;
    const segs = document.querySelectorAll(".segments .seg");
    let cur = 1;
    for (let i = 0; i < segs.length; i++){
      const el = segs[i];
      const r = el.getBoundingClientRect();
      if (r.top <= refY){
        if (el.dataset.day) cur = +el.dataset.day;
        else {
          const s = +el.dataset.bandStart, e = +el.dataset.bandEnd;
          const f = Math.min(1, Math.max(0, (refY - r.top) / Math.max(1, r.height)));
          cur = s + Math.round(f * (e - s));
        }
      } else break;
    }
    return cur;
  }, []);

  // Track the current day while scrolling, then STOP so the page can idle.
  // A "kick" starts a short rAF loop that reads live DOM positions each frame
  // and halts after a few still frames. Works for wheel/touch and programmatic
  // jumps alike, without a perpetual animation loop.
  useEffect(() => {
    let raf = 0, lastY = null, still = 0, running = false;
    const loop = () => {
      const y = window.scrollY;
      const c = computeDay();
      setCurrentDay(prev => prev === c ? prev : c);
      if (y === lastY) still++; else { still = 0; lastY = y; }
      if (still > 6){ running = false; raf = 0; return; }
      raf = requestAnimationFrame(loop);
    };
    const kick = () => { if (!running){ running = true; lastY = null; still = 0; raf = requestAnimationFrame(loop); } };
    kickRef.current = kick;
    window.addEventListener("scroll", kick, { passive:true });
    window.addEventListener("wheel", kick, { passive:true });
    window.addEventListener("touchmove", kick, { passive:true });
    const t = setTimeout(() => setCurrentDay(computeDay()), 350);
    return () => {
      window.removeEventListener("scroll", kick);
      window.removeEventListener("wheel", kick);
      window.removeEventListener("touchmove", kick);
      clearTimeout(t); if (raf) cancelAnimationFrame(raf);
    };
  }, [computeDay]);

  const jumpTo = useCallback((day) => {
    let el = document.querySelector(`.segments .seg[data-day="${day}"]`);
    let f = 0;
    if (!el){
      el = [...document.querySelectorAll(".segments .seg[data-band-start]")]
        .find(b => day >= +b.dataset.bandStart && day <= +b.dataset.bandEnd);
      if (el){ const s = +el.dataset.bandStart, e = +el.dataset.bandEnd; f = (day - s) / (e - s + 1); }
    }
    if (!el) return;
    const r = el.getBoundingClientRect();
    const offset = r.top + window.scrollY + f * r.height;
    window.scrollTo(0, Math.max(0, offset - window.innerHeight * 0.30));
    setCurrentDay(day);
    if (kickRef.current) kickRef.current();
  }, []);

  const toggleLane = (id) => setActiveLanes(prev => {
    const n = new Set(prev);
    // if all are on, clicking isolates this one; otherwise normal toggle
    if (n.size === LANES.length){ return new Set([id]); }
    if (n.has(id)) n.delete(id); else n.add(id);
    if (n.size === 0) return new Set(LANES.map(l => l.id));
    return n;
  });
  const allOn = activeLanes.size === LANES.length;

  return (
    <div className="app">
      {/* HERO */}
      <header className="hero">
        <p className="kicker mono">A comprehensive look into the process of imaging</p>
        <h1>So you need<br/><em>radiology?</em></h1>
        <p className="sub">One symptom. Four parties. Seventy-nine days before you hear what it means.</p>
        <div className="meta">
          <div className="metric"><div className="n mono">79</div><div className="l">days, start to answer</div></div>
          <div className="metric"><div className="n mono">~11</div><div className="l">weeks</div></div>
          <div className="metric"><div className="n mono">38</div><div className="l">days before the first visit</div></div>
          <div className="metric"><div className="n mono">4</div><div className="l">parties involved</div></div>
        </div>
        <p className="howto">
          Scroll to follow one patient’s imaging journey from first twinge to final results — the long
          stretches of waiting are drawn to scale. <b>Hover any event</b> to read what’s happening,
          <b> filter by stakeholder</b> to see how much unfolds out of sight, and <b>jump to any day</b>
          with the slider. The checklist on the right fills in as the days go by.
          <br/><span style={{color:"var(--ink-faint)"}}>Timeline based on national averages.</span>
        </p>
      </header>

      {/* CONTROLS */}
      <div className="controls">
        <div className="filters">
          <span className="flabel">Filter</span>
          {LANES.map(lane => (
            <button key={lane.id}
              className={`chip ${lane.cls} ${activeLanes.has(lane.id) ? "" : "off"}`}
              onClick={() => toggleLane(lane.id)}>
              <span className="dot"></span>{lane.name}
            </button>
          ))}
          {!allOn && <button className="chip-all" onClick={() => setActiveLanes(new Set(LANES.map(l => l.id)))}>show all</button>}
        </div>
        <div className="jump">
          <div className="hud">
            <div className="d mono">Day {currentDay} · Week {weekOf(currentDay)}</div>
            <div className="p">{phaseFor(currentDay)}</div>
          </div>
          <input type="range" min="1" max={TOTAL_DAYS} value={currentDay}
            onChange={e => jumpTo(+e.target.value)} aria-label="Jump to day" />
        </div>
      </div>

      {/* STAGE */}
      <div className="stage">
        <div className="tl">
          <div className="lanehdr">
            <div></div>
            {LANES.map(lane => (
              <div key={lane.id} className={`lh ${lane.cls} ${activeLanes.has(lane.id) ? "" : "dim"}`}>
                <span className="dot"></span>{lane.name}
              </div>
            ))}
          </div>
          <div className="segments">
            <div className="tracks">
              <div></div>
              {LANES.map(l => <div className="trk" key={l.id}></div>)}
            </div>
            {segments.map((seg, i) => {
              return seg.type === "day"
                ? <DayBlock key={i} seg={seg} activeLanes={activeLanes} />
                : <WaitBand key={i} seg={seg} activeLanes={activeLanes} />;
            })}
          </div>

          <div className="closing">
            <div className="big">Seventy-nine days for an answer.<br/><em>Most of it was waiting.</em></div>
            <p className="small">From the first notice of pain to sitting down with results, the patient
              was seen in person on a handful of days. The rest played out in scheduling queues,
              benefit checks, and prior-authorization reviews — almost entirely out of sight.</p>
          </div>
        </div>

        <aside className="aside">
          <Checklist currentDay={currentDay} />
        </aside>
      </div>
    </div>
  );
}

const style = document.createElement("style");
