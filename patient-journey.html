<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>So You Need Radiology?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/linux-libertine" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libertinus+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300..600&display=swap" rel="stylesheet">

<style id="base-vars">
  @font-face{
    font-family:"Belgiano Serif";
    src:url("fonts/BelgianoSerif.ttf");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    /* ===== canonical palette (design-system spec) ===== */
    --cream:   #E2F2FC;   /* page background */
    --paper:   #eef7fc;   /* cards, inputs, panels */
    --ink:     #1a1512;   /* primary text */
    --ink-2:   #5b5349;   /* secondary text, lede */
    --ink-3:   #8a8174;   /* muted / tertiary, labels */
    --accent:  #255B7E;   /* italic highlights, numbers, hover rules, CTA, beam */
    --accent-deep: #1b4862; /* accent hover/darker */
    --taupe:   #a8c8dc;   /* rank numbers in stats table */
    --line:    #c2dded;   /* borders, dividers */
    --dark:    #15110d;   /* lightbox hero background */
    --dark-2:  #211a13;   /* lightbox dark gradient */

    /* ----- aliases used throughout the build ----- */
    --bg:        var(--cream);
    --bg-deep:   #d3e7f6;
    --surface:   var(--paper);
    --surface-2: #e6f1f9;
    --ink-soft:  var(--ink-2);
    --ink-faint: var(--ink-3);
    --line-soft: #d8eaf5;

    /* stakeholder accents — shared L/C, hue varies (tweakable) */
    --h-patient:   240;
    --h-physician: 168;
    --h-insurance: 64;
    --h-radiology: 305;
    --h-digital:   200;
    --h-transport: 28;
    --h-primary:   240;   /* hero / "you are here" accent hue */

    /* typography (tweakable) */
    --font-head: "Linux Libertine", "Newsreader", Georgia, serif;
    --font-body: "Linux Libertine", "Newsreader", Georgia, serif;
    --font-num: "Linux Libertine", "Newsreader", Georgia, serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;

    /* density scale (tweakable) — multiplies paddings/gaps */
    --d: 1;

    --lanes: 6;
    --rail-w: 72px;
    --ctrl-h: 70px;
    --lanehdr-h: 52px;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .mono{ font-family:var(--font-mono); }
  /* numbers use Linux Libertine rather than the mono face (.app raises specificity) */
  .app .metric .n,
  .app .rday .dnum, .app .mrow .mday, .app .rrange,
  .app .scrollrail .sr-cap,
  .app .pos .hud .d,
  .app .checklist .cnt, .app .it-daytag,
  .app .refnum,
  .app .band .bdays{ font-family:var(--font-num); }
  /* Belgiano only on the three primary titles */
  .hero h1,
  .careplan h2,
  .refs h2{ font-family:var(--font-head); }

  .lane-patient{ --h:var(--h-patient); }
  .lane-physician{ --h:var(--h-physician); }
  .lane-insurance{ --h:var(--h-insurance); }
  .lane-radiology{ --h:var(--h-radiology); }
  .lane-digital{ --h:var(--h-digital); }
  .lane-transport{ --h:var(--h-transport); }

  #root{ min-height:100vh; }
  ::selection{ background:oklch(0.86 0.06 252); }

  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; border:3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--ink-faint); }
</style>

<style id="topbar-css">
  .topbar{position:fixed;top:0;left:0;right:0;z-index:9000;padding:11px 0;
    background:rgba(226,242,252,.92);backdrop-filter:blur(14px);
    border-bottom:1px solid #c2dded;box-shadow:0 8px 26px -22px rgba(26,21,18,.4);
    transition:box-shadow .45s ease;}
  .topbar.is-stuck{box-shadow:0 8px 26px -18px rgba(26,21,18,.55);}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:0 48px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .wordmark{font-family:"Libertinus Serif",Georgia,serif;font-size:23px;
    font-weight:420;letter-spacing:-.01em;color:#1a1512;white-space:nowrap;text-decoration:none;}
  .wordmark .wm-101{font-style:italic;color:#255B7E;}
  .topnav{display:flex;align-items:center;gap:6px;}
  .topnav-link{display:flex;align-items:baseline;gap:7px;padding:8px 13px;border-radius:8px;
    font-family:"Libertinus Serif",Georgia,serif;font-size:13.5px;color:#5b5349;
    text-decoration:none;transition:color .25s,background .25s;}
  .topnav-link .tnl-n{font-size:10.5px;letter-spacing:.08em;color:#8a8174;
    font-variant-numeric:tabular-nums;transition:color .25s;}
  .topnav-link:hover{background:rgba(26,21,18,.05);color:#1a1512;}
  .topnav-link:hover .tnl-n,.topnav-link.is-active .tnl-n{color:#255B7E;}
  .topnav-link.is-active{color:#1a1512;}
  .feedback-btn{display:flex;align-items:center;gap:8px;margin-left:10px;padding:9px 17px;
    border-radius:999px;border:1px solid #1a1512;font-family:"Libertinus Serif",Georgia,serif;
    font-size:13.5px;color:#1a1512;font-weight:500;text-decoration:none;transition:all .25s;}
  .feedback-btn:hover{background:#1a1512;color:#E2F2FC;}
  @media(max-width:880px){
    .topbar-inner{padding:0 22px;}
    .topnav-link .tnl-t{display:none;}
    .topnav-link{padding:8px 9px;}
  }
</style>

<style id="app-css">
.app{ max-width:1500px; margin:0 auto; padding:0 28px 130px 104px; }

/* ---- hero ---- */
.hero{ padding:84px 0 44px; position:relative; margin-top:66px; }
.hero .kicker{ font-size:13px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 22px; }
.hero h1{ font-family:'Libertinus Serif', Georgia, 'Times New Roman', serif;
  font-weight:400; font-size:clamp(40px, 6.6vw, 78px); line-height:1.0;
  letter-spacing:-0.018em; margin:0; }
.hero h1 em{ font-style:italic; color:#255B7E; }
.hero .sub{ font-family:'Libertinus Serif', Georgia, 'Times New Roman', serif;
  font-size:clamp(15px, 1.7vw, 17px); color:#5b5349;
  margin:24px 0 0; max-width:640px; line-height:1.64; }
.hero .meta{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px 40px; margin-top:40px;
  padding-top:30px; border-top:1px solid var(--line); max-width:660px; }
.metric .n{ font-size:34px; font-weight:420; letter-spacing:-.01em; line-height:1; color:var(--accent); }
.metric .l{ font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:8px; }
.hero .howto{ margin-top:30px; font-size:15.5px; color:var(--ink-soft); line-height:1.6; }
.hero .howto b{ font-weight:560; color:var(--ink); }

/* ---- fixed left scroll slider (always visible) ---- */
.scrollrail{ position:fixed; z-index:65;
  left: max(16px, calc(50vw - 750px + 12px));
  top: 13vh; height: 74vh; width:56px;
  display:flex; flex-direction:column; align-items:center; gap:11px; }
.scrollrail .sr-cap{ font-family:var(--font-mono); font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-faint); text-align:center; line-height:1.2; }
.scrollrail .sr-track{ position:relative; flex:1; display:flex; justify-content:center; min-height:0; }
.scrollrail input[type=range]{ -webkit-appearance:none; appearance:none;
  writing-mode:vertical-lr; width:6px; height:100%; margin:0; cursor:grab; outline:none;
  background:linear-gradient(180deg, var(--accent) 0 var(--fill,0%), var(--line) var(--fill,0%) 100%);
  border-radius:9px; }
.scrollrail input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none;
  width:17px; height:17px; border-radius:99px; background:var(--surface);
  border:2px solid var(--accent); cursor:grab;
  box-shadow:0 2px 7px rgba(40,60,90,.32); }
.scrollrail input[type=range]::-moz-range-thumb{ width:17px; height:17px; border-radius:99px;
  background:var(--surface); border:2px solid var(--accent); cursor:grab; }
.scrollrail .sr-day{ display:none; }

/* ---- always-visible "you are here" line ---- */
.hereline{ position:fixed; left:0; right:0; top:46vh; z-index:42; pointer-events:none; display:none; }
.hereline.on{ display:block; }
.hereline .hl-line{ position:absolute; top:0; height:0;
  border-top:1.5px dotted color-mix(in srgb, var(--accent) 62%, transparent); }
.hereline .hl-tag{ position:absolute; top:-16px; background:var(--accent); color:#fff;
  font-family:var(--font-mono); border-radius:9px; padding:4px 9px; text-align:right; line-height:1.18;
  box-shadow:0 6px 16px -7px color-mix(in srgb, var(--accent) 60%, transparent); }
.hereline .hl-tag .k{ font-size:7.5px; letter-spacing:.13em; opacity:.85; display:block; }
.hereline .hl-tag .d{ font-size:12px; font-weight:600; letter-spacing:.02em; display:block; }

/* ---- sticky filter headers (one per column) ---- */
.colhead{ position:sticky; top:0; z-index:55; display:grid;
  grid-template-columns:var(--rail-w) repeat(var(--lanes),minmax(0,1fr));
  background:color-mix(in oklch, var(--bg) 90%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:9px 0 10px; align-items:stretch; }
.colhead .ch-rail{ display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
.colhead .ch-all{ cursor:pointer; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-faint); background:none; border:none; padding:2px;
  text-align:right; line-height:1.25; }
.colhead .ch-all:hover{ color:var(--accent); }
.colchip{ margin:0 4px; cursor:pointer; font-family:inherit; display:flex; align-items:center;
  justify-content:center; gap:7px; border:1px solid oklch(0.82 0.05 var(--h));
  background:oklch(0.972 0.026 var(--h)); color:oklch(0.40 0.09 var(--h));
  border-radius:10px; padding:9px 6px; font-size:14px; line-height:1.05; transition:.16s; text-align:center; }
.colchip .dot{ width:8px; height:8px; border-radius:99px; background:oklch(0.56 0.13 var(--h)); flex:none; }
.colchip.off{ background:transparent; color:var(--ink-faint); border-color:var(--line); }
.colchip.off .dot{ background:var(--line); }
.colchip:hover{ transform:translateY(-1px); border-color:oklch(0.70 0.08 var(--h)); }

/* ---- stage: timeline + aside ---- */
.stage{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:34px; align-items:start; }
.tl{ position:relative; }

/* ---- flow (to-scale, day-positioned timeline) ---- */
.flow{ display:grid; grid-template-columns:var(--rail-w) repeat(var(--lanes),minmax(0,1fr));
  grid-template-rows:100%; position:relative; }
.tracks{ position:absolute; inset:0; display:grid;
  grid-template-columns:var(--rail-w) repeat(var(--lanes),minmax(0,1fr)); pointer-events:none; z-index:0; }
.tracks > div{ position:relative; }
.tracks .trk::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:1px;
  background:var(--line); transform:translateX(-0.5px); }
.railcol, .lanecol{ position:relative; min-height:100%; }

/* rail day labels (absolutely placed by day) */
.rday{ position:absolute; right:10px; text-align:right; transform:translateY(-1px); white-space:nowrap; }
.rday .dnum{ font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--ink); }
.rday.past .dnum{ color:var(--ink-faint); }
.rday.now .dnum{ color:var(--accent); }
.rrange{ position:absolute; right:10px; text-align:right; white-space:nowrap;
  font-size:10.5px; font-weight:500; color:var(--ink-faint); }

/* event slot (one per lane-day; stacks same-day cards) */
.slot{ position:absolute; left:6px; right:6px; display:flex; flex-direction:column; gap:6px; z-index:1; }
.slot:has(.card:hover), .slot:has(.card:focus-within){ z-index:50; }

/* event card */
.card{ position:relative; border:1px solid oklch(0.840 0.045 var(--h));
  background:oklch(0.984 0.014 var(--h)); border-radius:11px; padding:calc(6px * var(--d)) 11px calc(7px * var(--d));
  cursor:default; transition:opacity .22s, box-shadow .18s, transform .18s, border-color .18s; }
.card::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:9px; background:oklch(0.585 0.130 var(--h)); }
.card:hover{ box-shadow:0 10px 26px -14px oklch(0.45 0.08 var(--h) / .55); transform:translateY(-2px);
  border-color:oklch(0.700 0.090 var(--h)); z-index:5; }
.card .ctitle{ font-size:13.5px; font-weight:540; letter-spacing:-.005em; line-height:1.14;
  padding-left:7px; display:flex; align-items:baseline; gap:7px; }
.card .ctag{ display:flex; align-items:center; gap:6px; margin-top:7px; padding-left:6px;
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:oklch(0.520 0.095 var(--h)); }
.card .ctag .bts{ color:var(--ink-faint); font-style:italic; text-transform:none; letter-spacing:0;
  font-size:12px; }
.card .ctag .arrow{ display:inline-block; transform:translateY(1px); }
.clane{ display:none; }

/* hover popover */
.pop{ position:absolute; top:calc(100% + 9px); width:266px; background:var(--surface);
  border:1px solid oklch(0.820 0.050 var(--h)); border-radius:12px; padding:13px 15px;
  box-shadow:0 18px 40px -16px rgba(38,54,82,.45); z-index:30; font-size:14.5px; line-height:1.5;
  color:var(--ink-soft); opacity:0; visibility:hidden; transform:translateY(-4px); transition:.16s; }
.pop.left{ left:6px; } .pop.right{ right:6px; }
.card:hover .pop, .card:focus-within .pop{ opacity:1; visibility:visible; transform:translateY(0); }
.pop b{ color:var(--ink); font-weight:560; }
.pop .pday{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:oklch(0.560 0.110 var(--h));
  margin-bottom:6px; }

/* ===== past / now / future states ===== */
.card .donecheck{ display:none; }

/* past — done */
.slot.is-past .card{ opacity:.6; }
.slot.is-past .card::before{ background:oklch(0.72 0.05 var(--h)); }
.slot.is-past .card .ctitle{ color:var(--ink-soft); }
.slot.is-past .card .donecheck{ display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; border-radius:99px; background:oklch(0.62 0.10 var(--h)); flex:none; transform:translateY(1px); }
.slot.is-past .card .donecheck svg{ width:10px; height:10px; }
.slot.is-past:hover .card{ opacity:.92; }

/* future — upcoming (solid, faded — no dashes) */
.slot.is-future .card{ background:var(--surface); border-color:oklch(0.88 0.035 var(--h)); opacity:.9; }
.slot.is-future .card::before{ background:oklch(0.82 0.05 var(--h)); }
.slot.is-future .card .ctitle{ color:var(--ink-soft); font-weight:500; }

/* now — lit (glow) */
.card.lit{ animation:beatGlow 1.9s ease-in-out infinite;
  border-color:oklch(0.62 0.12 var(--h)); z-index:4; opacity:1 !important; }
.card.lit::before{ background:oklch(0.55 0.16 var(--h)); box-shadow:0 0 10px oklch(0.6 0.16 var(--h) / .6); }
.card.lit .ctitle{ color:oklch(0.34 0.06 var(--h)) !important; }

/* waiting band — absolutely placed inside its own lane column */
.band-abs{ position:absolute; left:5px; right:5px; padding:10px 0 6px; }
.band{ height:100%; border-radius:12px; border:1px solid oklch(0.88 0.035 var(--h));
  background:oklch(0.972 0.020 var(--h) / .5);
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  padding:12px 9px; position:relative; overflow:hidden; transition:opacity .22s, box-shadow .22s, border-color .22s; }
.band::after{ content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background:repeating-linear-gradient(135deg, transparent 0 13px, oklch(0.86 0.04 var(--h) / .14) 13px 14px); }
.band.compact{ padding:9px 8px; }
.band .bdays{ position:relative; font-family:var(--font-mono); font-size:9.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:oklch(0.52 0.10 var(--h)); }
.band .blabel{ position:relative; font-size:15px; font-weight:430; letter-spacing:-.01em;
  margin-top:5px; line-height:1.2; }
.band.compact .blabel{ font-size:13.5px; margin-top:3px; }
.band .bnote{ position:relative; font-size:12px; color:var(--ink-soft); margin-top:8px;
  line-height:1.5; font-style:italic; }
.band .btip{ position:relative; margin-top:12px; display:flex; flex-direction:column; gap:4px;
  text-align:left; background:var(--surface); border:1px solid oklch(0.88 0.035 var(--h));
  border-radius:10px; padding:8px 10px; }
.band .btip .bk{ font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase;
  color:oklch(0.55 0.10 var(--h)); }
.band .btip .bx{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }
.band-abs.is-past .band{ opacity:.5; }
.band-abs.is-future .band{ opacity:.82; }
.band-abs.is-now .band{ border-color:oklch(0.6 0.11 var(--h));
  box-shadow:0 16px 40px -22px oklch(0.45 0.12 var(--h) / .55); }

/* ===== glow for the lit (current) card(s) ===== */
@keyframes beatGlow{
  0%,100%{ box-shadow:0 0 0 0 oklch(0.60 0.13 var(--h) / 0), 0 14px 32px -18px oklch(0.45 0.10 var(--h) / .55); }
  50%{ box-shadow:0 0 0 6px oklch(0.62 0.13 var(--h) / .16), 0 20px 42px -16px oklch(0.45 0.13 var(--h) / .72); }
}
@media (prefers-reduced-motion: reduce){
  .card.lit{ animation:none;
    box-shadow:0 0 0 5px oklch(0.62 0.13 var(--h) / .16), 0 16px 36px -16px oklch(0.45 0.12 var(--h) / .6); }
}

/* dimming for filter */
.dimmed{ opacity:.1 !important; pointer-events:none; }
.dimmed .pop{ display:none; }

/* ---- aside checklist ---- */
.aside{ position:sticky; top:80px; }
.checklist{ background:var(--surface); border:1px solid var(--line); border-radius:17px;
  padding:19px 19px 13px; box-shadow:0 14px 40px -26px rgba(38,54,82,.5); }
.checklist .chead{ display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding-bottom:13px; border-bottom:1px solid var(--line-soft); }
.checklist .chead h3{ margin:0; font-size:18px; font-weight:540; letter-spacing:-.01em; }
.checklist .chead .cnt{ font-size:12.5px; color:var(--ink-faint); }
.checklist .csub{ font-size:12.5px; color:var(--ink-faint); margin:9px 0 4px; line-height:1.45; }
/* next-up banner */
.nextup{ margin:12px 0 4px; background:oklch(0.965 0.03 var(--h-primary));
  border:1px solid oklch(0.86 0.06 var(--h-primary)); border-radius:11px; padding:11px 13px; }
.nextup .nk{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--accent); }
.nextup .nt{ font-size:14.5px; color:var(--ink); margin-top:4px; line-height:1.3; }
.items{ list-style:none; margin:8px 0 0; padding:0; }
.item{ display:flex; gap:11px; align-items:flex-start; padding:9px 6px 9px 6px; cursor:pointer;
  border-bottom:1px solid var(--line-soft); transition:.25s; }
.item:hover{ background:oklch(0.975 0.012 235); border-radius:9px; }
.item:last-child{ border-bottom:none; }
.item .box{ flex:none; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--ink-faint);
  margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  background:var(--surface); transition:.16s; }
.item .box svg{ width:12px; height:12px; opacity:0; transform:scale(.6); transition:.16s; }
.item.checked .box{ background:oklch(0.55 0.10 168); border-color:oklch(0.55 0.10 168); }
.item.checked .box svg{ opacity:1; transform:scale(1); }
.item .it-main{ flex:1; min-width:0; }
.it-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.item .it-text{ font-size:14.5px; line-height:1.25; }
.it-daytag{ flex:none; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.02em; color:var(--ink-faint);
  white-space:nowrap; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:6px; padding:2px 6px; }
.item.active .it-daytag{ color:var(--accent); border-color:oklch(0.82 0.07 var(--h-primary));
  background:oklch(0.97 0.02 var(--h-primary)); }
.item .it-detail{ font-size:12.5px; color:var(--ink-faint); margin-top:3px; line-height:1.4; }
.item.checked .it-text{ color:var(--ink-faint); text-decoration:line-through;
  text-decoration-color:oklch(0.7 0.03 168); }
.item.locked{ opacity:.42; }
.item.locked .box{ border-style:dashed; cursor:default; background:transparent; }
.item .it-day{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);
  margin-top:3px; }
.item.isnext{ background:oklch(0.97 0.025 var(--h-primary)); border-radius:9px; }
.item.active{ background:oklch(0.965 0.03 var(--h-primary)); border-radius:9px;
  box-shadow:inset 3px 0 0 var(--accent); }
.item.active .it-text{ color:var(--accent); }
.checklist .cnow{ font-family:var(--font-body); font-size:15px; font-style:italic;
  color:var(--accent); margin:12px 0 2px; display:flex; align-items:center; gap:8px; }
.checklist .cnow .pin{ width:7px; height:7px; border-radius:99px; background:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.item.justunlocked{ animation:pulse 1.1s ease; }
@keyframes pulse{ 0%{ background:oklch(0.95 0.05 168 / .0);} 22%{ background:oklch(0.93 0.06 168 / .8);} 100%{ background:transparent; } }

/* ---- care plan: paying the bill ---- */
.careplan{ --h:var(--h-insurance); margin-top:40px; padding-top:42px; border-top:1px solid var(--line); }
.careplan h2{ font-weight:400; font-size:clamp(30px,3.6vw,46px); letter-spacing:-.02em; margin:0; line-height:1.04; }
.careplan h2 em{ font-style:italic; color:var(--accent); }
.careplan .cp-lede{ font-size:16.5px; color:var(--ink-soft); line-height:1.6; margin:16px 0 0; max-width:66ch; }
.cp-list{ list-style:none; margin:24px 0 0; padding:0; max-width:80ch; }
.cp-list li{ position:relative; padding:11px 0 11px 22px; border-top:1px solid var(--line-soft);
  font-size:14.5px; line-height:1.55; color:var(--ink-soft); }
.cp-list li:first-child{ border-top:none; }
.cp-list li::before{ content:""; position:absolute; left:2px; top:18px; width:7px; height:7px;
  border-radius:99px; background:oklch(0.6 0.12 var(--h)); }
.cp-list li b{ color:var(--ink); font-weight:600; }
.cp-note{ margin-top:22px; font-size:13.5px; color:var(--ink-faint); font-style:italic; line-height:1.55; max-width:74ch; }

/* ---- references ---- */
.reflink{ color:var(--accent); text-decoration:underline;
  text-underline-offset:3px; text-decoration-thickness:1px; cursor:pointer;
  transition:color .16s; }
.reflink:hover{ color:var(--accent-deep); }
.refs{ margin-top:34px; padding-top:40px; border-top:1px solid var(--line);
  scroll-margin-top:90px; }
.refs-head{ max-width:62ch; }
.refs-k{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint); }
.refs-head h2{ font-weight:400; font-size:clamp(26px,3vw,34px); letter-spacing:-.015em;
  margin:12px 0 0; }
.refs-intro{ font-size:15.5px; color:var(--ink-soft); line-height:1.6; margin:14px 0 0; }
.reflist{ list-style:none; margin:30px 0 0; padding:0; max-width:90ch;
  border-top:1px solid var(--line-soft); }
.refitem{ display:grid; grid-template-columns:42px 1fr; gap:8px 14px; align-items:start;
  padding:18px 4px; border-bottom:1px solid var(--line-soft); }
.refnum{ font-size:13px; color:var(--accent); font-weight:600; padding-top:2px; }
.reftitle{ font-size:17px; letter-spacing:-.005em; line-height:1.3; color:var(--ink);
  text-decoration:none; display:inline-block; transition:color .15s; }
.reftitle:hover{ color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
.reftitle .refext{ font-size:13px; color:var(--ink-faint); }
.refsrc{ font-size:13.5px; color:var(--ink-soft); margin-top:5px; font-style:italic; }
.refnote{ font-size:13.5px; color:var(--ink-faint); margin-top:7px; line-height:1.5; }

.footer-credit{
  max-width:1500px;

  .slot.is-future .card .pop, .slot.is-past .card .pop{ opacity:1; visibility:visible; }

  /* you-are-here line: full width, tag at left */
  .hereline .hl-tag{ top:-15px; left:0; right:auto !important; border-radius:0 9px 9px 0; padding:4px 10px 4px 16px; }
  .hereline .hl-tag .k{ font-size:7px; }

  /* scrubber: horizontal bar pinned to the bottom */
  .scrollrail{ position:fixed; left:0; right:0; bottom:0; top:auto; width:auto; height:auto;
    flex-direction:row; align-items:center; gap:12px; padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
    background:color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter:blur(12px);

  .scrollrail .sr-cap{ flex:0 0 auto; }
  .scrollrail .sr-track{ flex:1; min-height:0; }
  .scrollrail input[type=range]{ writing-mode:horizontal-tb; -webkit-appearance:none; appearance:none;
    width:100%; height:6px;
    background:linear-gradient(90deg, var(--accent) 0 var(--fill,0%), var(--line) var(--fill,0%) 100%); }
  .scrollrail input[type=range]::-webkit-slider-thumb{ width:22px; height:22px; }
  .scrollrail input[type=range]::-moz-range-thumb{ width:22px; height:22px; }

  /* care plan + references breathing room */

  .cp-list li{ font-size:14px; }
  .reflist{ }
}
@media (max-width:380px){
  .mrow{ grid-template-columns:46px minmax(0,1fr); gap:8px; }
  .hero h1{ font-size:42px; }
}

<script>
window.RAD = (function(){
  const LANES = [
    { id:"patient",   name:"Patient",     full:"Patient",          cls:"lane-patient" },
    { id:"physician", name:"Physician",   full:"In-network physician", cls:"lane-physician" },
    { id:"insurance", name:"Insurance",   full:"Insurance",        cls:"lane-insurance" },
    { id:"radiology", name:"Radiology",   full:"Radiology",        cls:"lane-radiology" },
    { id:"digital",   name:"Digital",     full:"Digital services",  cls:"lane-digital" },
    { id:"transport", name:"Transport",   full:"Transportation",   cls:"lane-transport" },
  ];

  const EVENTS = [
    // ---- onset ----
    { day:1,  lane:"patient",   title:"Notices the pain",
      desc:"“Should I be worried? I’ll give it a week.” Scared about what it might be — and what it might cost." },
    { day:2,  lane:"digital",   title:"Googling symptoms",
      desc:"Searching symptoms online, reading forums, and worrying about what it could mean before deciding to act." },

    // ---- deciding to be seen (day 8) ----
    { day:8,  lane:"patient",   title:"Decides to schedule appointment",
      desc:"“Still bothering me, so I’m going to reach out to a doctor.”" },
    { day:8,  lane:"insurance", title:"Find an in-network physician",
      desc:"The office confirms the plan is active and checks the patient’s financial responsibility (deductible, copay). Note: advanced imaging — CT, MRI, and similar — normally requires prior authorization, which typically takes several business days. Routine imaging such as X-ray usually does not." },
    { day:8,  lane:"digital",   title:"Requested online",
      desc:"The patient requests the visit through the practice’s patient portal or website form." },
    { day:8,  lane:"physician", title:"Appointment scheduled",
      desc:"The practice books the patient into the first available slot." },

    // ---- end of the long wait ----
    { day:38, lane:"patient",   title:"Pain has subsided",
      desc:"Pain decreasing, but the appointment is finally approaching." },

    // ---- first appointment (day 39): exam, order, same-day everything ----
    { day:39, lane:"patient",   title:"First appointment",
      desc:"The first available appointment with the in-network physician finally arrives." },
    { day:39, lane:"physician", title:"Examines & orders imaging",
      desc:"The physician assesses symptoms, reviews history, and performs a physical exam, determining imaging is needed and places the order the same day. Because the imaging suite is in the same complex, the patient is asked to return the next day for the scan." },
    { day:39, lane:"insurance", title:"Coverage double-checked",
      desc:"The office confirms the plan is active and checks the patient’s financial responsibility (deductible, copay). Note: advanced imaging — CT, MRI, and similar — normally requires prior authorization, which typically takes several business days. Routine imaging such as X-ray usually does not." },
    { day:39, lane:"digital",   title:"Books imaging slot online",
      desc:"The patient picks tomorrow’s imaging time slot through the portal and receives prep instructions." },
    { day:39, lane:"transport", title:"Getting there",
      desc:"The patient arranges a round trip to the appointment (driving, transit, or a ride from family or friends)." },

    // ---- imaging day (day 40) ----
    { day:40, lane:"patient",   title:"Imaging day",
      desc:"Follows any provided prep instructions (for example, fasting), then has the imaging performed." },
    { day:40, lane:"radiology", title:"Scan performed",
      desc:"Patient prep (contrast dye, positioning, consent), then the imaging is performed." },
    { day:40, lane:"transport", title:"Ride to imaging",
      desc:"A round trip to the scan is essential when contrast or sedation means the patient can’t drive afterward." },

    // ---- report next day (day 41) + results to everyone ----
    { day:41, lane:"radiology", title:"Reads & reports",
      desc:"The radiologist interprets the images, finalizes the report, and sends it to the physician the next day." },
    { day:41, lane:"physician", title:"Receives the report",
      desc:"The report arrives and the physician is notified; a follow-up visit is set." },
    { day:41, lane:"patient",   title:"Notified results are in",
      desc:"Gets a portal notification that the results are ready." },
    { day:41, lane:"digital",   title:"Results posted",
      desc:"The finalized report is released to the patient portal, often before the physician has reviewed it." },
    { day:41, lane:"radiology", title:"Imaging claim sent", billing:true,
      desc:"The radiologist’s office sends the imaging claim to insurance the same day the study is performed and interpreted." },
    { day:41, lane:"patient",   title:"Schedules the follow-up",
      desc:"With results in hand, the patient books a follow-up visit to go over them — through the portal or a quick call." },
    { day:41, lane:"physician", title:"Follow-up booked",
      desc:"The office receives the request and schedules the results visit." },
    { day:41, lane:"digital",   title:"Books follow-up online",
      desc:"The follow-up is requested and confirmed through the patient portal." },

    // ---- follow-up visit (day 44) ----
    { day:44, lane:"patient",   title:"Follow-up appointment",
      desc:"The patient returns for the results and the physician’s recommendations." },
    { day:44, lane:"physician", title:"Explains results & next steps",
      desc:"The physician explains the findings and recommends next steps (rest, medication, a referral, or further imaging)." },
    { day:44, lane:"digital",   title:"Visit summary shared",
      desc:"An after-visit summary and care plan are posted to the portal, with messaging for follow-up questions." },
    { day:44, lane:"transport", title:"Round trip to follow-up",
      desc:"The patient travels to and from the follow-up visit." },

    // ---- billing chain ----
    { day:48, lane:"insurance", title:"Imaging bill received", billing:true,
      desc:"Insurance receives the radiologist’s imaging claim, about a week after it was sent." },
    { day:48, lane:"digital",   title:"Asks the financial agent",
      desc:"The patient opens the portal’s financial assistant to ask what everything will cost, i.e. what insurance covers, the remaining balance, payment-plan options, and whether any financial assistance is available." },
    { day:49, lane:"physician", title:"Visit claims coded & billed", billing:true,
      desc:"The office translates each visit into standardized medical codes (CPT and ICD), assembles the initial and follow-up visit claims, and submits them to insurance." },
    { day:51, lane:"physician", title:"Visit claims submitted", billing:true,
      desc:"The physician’s office submits both the initial and follow-up visit claims, about a week after the final visit." },
    { day:58, lane:"insurance", title:"Visit claims received", billing:true,
      desc:"Insurance receives the physician’s visit claims, about a week after they were sent." },
    { day:79, lane:"insurance", title:"Everything processed", billing:true,
      desc:"After about three weeks of processing both the imaging and visit claims, insurance issues an explanation of benefits (EOB)." },
    { day:89, lane:"patient",   title:"The bill arrives", billing:true,
      desc:"The patient receives their bill, roughly 45 days after the final visit." },

    // ---- life after the bill (the future) ----
    { day:94,  lane:"patient",  title:"Builds steadier habits",
      desc:"Eases back in gradually, warms up before activity, and mixes in low-impact cross-training so the pain is less likely to return. If it does, remember the timeline it will take to get it looked it." },
  ];

  // bands fill the gaps between event days. `start` = (previous event day + 1).
  const BANDS = [
    { start:3,  end:7,  lane:"patient",   full:true,  label:"Waiting it out",
      note:"Hoping it passes on its own.",
      tip:"Jot down when it started and what makes it better or worse. Those notes make your first visit faster." },
    { start:9,  end:37, lane:"patient",   full:true,  label:"Waiting for the first available appointment",
      note:"Nearly a month before the first open slot. The pain often fades before you’re ever seen.",
      tip:"Ask to be put on the cancellation list, and call back if anything changes — new or worse symptoms can move you up the list." },
    { start:43, end:47, lane:"radiology", full:false, label:"Imaging claim on its way",
      note:"The imaging claim travels to the insurer." },
    { start:52, end:57, lane:"physician", full:true,  label:"Visit claims in transit",
      note:"The physician’s visit claims make their way to the insurer.",
      tip:"Keep your visit paperwork handy — it helps if you ever need to reference or dispute a charge." },
    { start:59, end:78, lane:"insurance", full:true,  label:"Insurance processes everything",
      note:"About three weeks of claims processing across both the imaging and visit bills.",
      tip:"Watch your portal for an explanation of benefits (EOB) — it shows what you’ll owe before the bill ever arrives." },
    { start:80, end:88, lane:"insurance", full:true,  label:"Your bill is on its way",
      note:"The final patient bill is prepared and mailed.",
      tip:"Review it line by line against your EOB. If something doesn’t match, call the billing office before you pay." },
  ];

  const CHECKLIST = [
    { day:1,  text:"Notes on your symptoms",         detail:"When it started, what makes it better or worse." },
    { day:2,  text:"Insurance card",                 detail:"Member ID and group number on hand." },
    { day:2,  text:"Find an in-network physician",    detail:"Use your insurer’s online directory, member app, or the number on your card. Be sure to confirm the office takes your plan." },
    { day:3,  text:"Request time off work/school",  detail:"You’ll need it across the appointment, the scan, and the follow-up." },
    { day:39, text:"Medical history & medications",  detail:"Bring a current list to the first visit." },
    { day:39, text:"Photo ID & copay",               detail:"Payment for the visit." },
    { day:39, text:"Book your imaging slot online",  detail:"Pick the next-day scan time through the portal and read the prep instructions." },
    { day:39, text:"Round trips for two days",       detail:"Line up rides for both the appointment and the next-day scan, especially if you’ll get contrast or sedation." },
    { day:40, text:"Comfortable clothes, no metal",  detail:"Plus the consent form and any fasting prep for the scan." },
    { day:41, text:"Check the patient portal",       detail:"Results often post before your follow-up visit." },
    { day:44, text:"Questions for your follow-up",   detail:"Write them down before you go." },
    { day:79, text:"Watch for your EOB",             detail:"Your explanation of benefits shows what you’ll owe before the bill arrives." },
    { day:89, text:"Review your bill vs. the EOB",   detail:"If charges don’t match, call the billing office before paying." },
  ];

  const PHASES = [
    { from:1,  to:7,  name:"Should I worry?" },
    { from:8,  to:38, name:"Waiting to be seen" },
    { from:39, to:39, name:"At the appointment" },
    { from:40, to:41, name:"Imaging & results" },
    { from:42, to:44, name:"The follow-up" },
    { from:45, to:89, name:"Billing" },
    { from:90, to:94, name:"Life after the bill" },
  ];

  const TOTAL_DAYS = 94;
  const RESULTS_DAY = 41;   // results land in the portal
  return { LANES, EVENTS, BANDS, CHECKLIST, PHASES, TOTAL_DAYS, RESULTS_DAY };
})();

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {

        <span>{label}</span>

      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>

}

function TweakToggle({ label, value, onChange }) {
  return (

      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

const PALETTES = [
{ name: "Clinical", hues: [240, 168, 64, 305, 200, 28], primary: 240 },
{ name: "Forest", hues: [250, 150, 95, 330, 200, 35], primary: 250 },
{ name: "Dusk", hues: [285, 200, 60, 22, 235, 0], primary: 285 }];

const FONTS = {
  Editorial: { body: '"Linux Libertine", "Newsreader", Georgia, serif', mono: '"IBM Plex Mono", ui-monospace, monospace' },
  Classic: { body: 'Georgia, "Times New Roman", serif', mono: '"IBM Plex Mono", ui-monospace, monospace' },
  Modern: { body: '"Inter", system-ui, sans-serif', mono: '"IBM Plex Mono", ui-monospace, monospace' }
};
const DENSITY = { compact: 0.82, regular: 1, comfy: 1.2 };

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "Clinical",
  "font": "Editorial",
  "density": "regular",
  "tone": "guide"
} /*EDITMODE-END*/;

/* ------------------------------------------------------ helpers --- */
const laneById = Object.fromEntries(LANES.map((l) => [l.id, l]));
function phaseFor(day) {const p = PHASES.find((p) => day >= p.from && day <= p.to);return p ? p.name : "";}
const CheckIcon = () =>
<svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>;

function buildLayout() {
  const evDays = [...new Set(EVENTS.map((e) => e.day))].sort((a, b) => a - b);
  const firstDay = evDays[0],lastDay = evDays[evDays.length - 1];
  const slots = {};LANES.forEach((l) => {slots[l.id] = [];});
  evDays.forEach((day) => LANES.forEach((l) => {
    const evs = EVENTS.filter((e) => e.day === day && e.lane === l.id);
    if (evs.length) slots[l.id].push({ day, events: evs });
  }));
  const bandsByLane = {};LANES.forEach((l) => {bandsByLane[l.id] = [];});
  BANDS.forEach((b) => bandsByLane[b.lane].push(b));
  return { evDays, firstDay, lastDay, slots, bandsByLane };
}

/* ------------------------------------------------------ EventCard --- */
function EventCard({ ev, side, active, lit }) {
  const lane = laneById[ev.lane];
  return (
    <div className={`card ${lane.cls} ${active ? "" : "dimmed"} ${lit && active ? "lit" : ""}`} tabIndex={0}>
      <div className="clane"><span className="dot"></span>{lane.name}{ev.billing ? " · Billing" : ""}</div>
      <div className="ctitle">
        <span>{ev.title}</span>
        <span className="donecheck"><CheckIcon /></span>
      </div>
      <div className={`pop ${side}`}>
        <div className="pday mono">{phaseFor(ev.day)}{ev.billing && phaseFor(ev.day) !== "Billing" ? " · Billing" : ""}</div>
        {ev.desc}
      </div>
    </div>);
}

/* ------------------------------------------------------ Checklist --- */
function Checklist({ currentDay, activeDay, copy, onJump }) {
  const [checked, setChecked] = useState(() => {
    try {return JSON.parse(localStorage.getItem("rad_checked")) || CHECKLIST.map(() => false);}
    catch {return CHECKLIST.map(() => false);}
  });
  const prevUnlocked = useRef(0);
  const [justIdx, setJustIdx] = useState(-1);

  const unlockedCount = CHECKLIST.filter((c) => currentDay >= c.day).length;
  useEffect(() => {
    if (unlockedCount > prevUnlocked.current) {
      setJustIdx(unlockedCount - 1);
      const t = setTimeout(() => setJustIdx(-1), 1200);
      prevUnlocked.current = unlockedCount;
      return () => clearTimeout(t);
    }
    prevUnlocked.current = unlockedCount;
  }, [unlockedCount]);

  const toggle = (i) => setChecked((c) => {
    const n = [...c];n[i] = !n[i];
    try {localStorage.setItem("rad_checked", JSON.stringify(n));} catch {}
    return n;
  });

  const nextIdx = CHECKLIST.findIndex((c, i) => currentDay >= c.day && !checked[i]);

  return (
    <div className="checklist">
      <div className="chead">
        <h3>What you'll need</h3>
        <span className="cnt mono">{unlockedCount} / {CHECKLIST.length}</span>
      </div>
      <p className="csub">{copy.checkSub}</p>
      <div className="cnow"><span className="pin"></span>{phaseFor(currentDay)}</div>
      {nextIdx >= 0 &&
      <div className="nextup">
          <div className="nk">Next, bring</div>
          <div className="nt">{CHECKLIST[nextIdx].text}</div>
        </div>
      }
      <ul className="items">
        {CHECKLIST.map((c, i) => {
          const unlocked = currentDay >= c.day;
          const isChecked = checked[i] && unlocked;
          const isActive = activeDay != null && c.day === activeDay;
          return (
            <li key={i}
            className={`item ${unlocked ? "" : "locked"} ${isChecked ? "checked" : ""} ${i === nextIdx ? "isnext" : ""} ${isActive ? "active" : ""} ${justIdx === i ? "justunlocked" : ""}`}
            onClick={() => onJump(c.day)} title={`Jump to day ${c.day}`}>
              <div className="box" onClick={(e) => {e.stopPropagation();if (unlocked) toggle(i);}} role="checkbox" aria-checked={isChecked}>
                <CheckIcon />
              </div>
              <div className="it-main">
                <div className="it-row">
                  <span className="it-text">{c.text}</span>
                  <span className="it-daytag mono">Day {c.day}</span>
                </div>
                <div className="it-detail">{c.detail}</div>
              </div>
            </li>);
        })}
      </ul>
    </div>);
}

/* ------------------------------------------------------ Tweaks --- */
function PaletteControl({ value, onChange }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: "4px 0 2px" }}>
      {PALETTES.map((p) => {
        const sel = p.name === value;
        return (
          <button key={p.name} onClick={() => onChange(p.name)}
          style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
            background: sel ? "rgba(255,255,255,.07)" : "transparent",
            border: "1px solid " + (sel ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.12)"),
            borderRadius: 9, padding: "8px 11px", color: "inherit", font: "inherit", textAlign: "left" }}>
            <span style={{ display: "flex", gap: 4 }}>
              {p.hues.map((h, i) => <span key={i} style={{ width: 13, height: 13, borderRadius: 99, background: `oklch(0.6 0.13 ${h})` }} />)}
            </span>
            <span style={{ fontSize: 13 }}>{p.name}</span>
          </button>);
      })}
    </div>);
}

function TweaksUI({ t, setTweak }) {
  return (
    <TweaksPanel>
      <TweakSection label="Accent palette" />
      <PaletteControl value={t.palette} onChange={(v) => setTweak("palette", v)} />
      <TweakSection label="Typography" />
      <TweakRadio label="Type" value={t.font} options={["Editorial", "Classic", "Modern"]} onChange={(v) => setTweak("font", v)} />
      <TweakSection label="Layout" />
      <TweakRadio label="Density" value={t.density} options={["compact", "regular", "comfy"]} onChange={(v) => setTweak("density", v)} />
      <TweakSection label="Tone of voice" />
      <TweakRadio label="Tone" value={t.tone} options={["guide", "plain", "reassure"]} onChange={(v) => setTweak("tone", v)} />
    </TweaksPanel>);
}

/* ------------------------------------------------------ App --- */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { evDays, firstDay, lastDay, slots, bandsByLane } = useMemo(buildLayout, []);
  const [activeLanes, setActiveLanes] = useState(() => new Set(LANES.map((l) => l.id)));
  const copy = COPY[t.tone] || COPY.guide;

  // ---- responsive: single-column chronological model on mobile ----
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.matchMedia("(max-width: 760px)").matches);
  useEffect(() => {
    const mq = window.matchMedia("(max-width: 760px)");
    const on = () => setIsMobile(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => {mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on);};
  }, []);

  const mRows = useMemo(() => {
    const dayMap = {};
    EVENTS.forEach((e) => {(dayMap[e.day] = dayMap[e.day] || []).push(e);});
    const items = [];
    Object.keys(dayMap).map(Number).forEach((d) => items.push({ type: "day", day: d, key: "d" + d, events: dayMap[d] }));
    BANDS.forEach((b, i) => items.push({ type: "band", day: b.start, endDay: b.end, key: "b" + i, band: b }));
    items.sort((a, b) => a.day - b.day || (a.type === "band" ? -1 : 1));
    return items;
  }, []);

  const y = (day) => PAD + (day - firstDay) * UNIT;
  const flowH = PAD + (lastDay - firstDay) * UNIT + 96;

  // ---- apply tweaks ----
  useEffect(() => {
    const r = document.documentElement.style;
    const pal = PALETTES.find((p) => p.name === t.palette) || PALETTES[0];
    const ln = ["patient", "physician", "insurance", "radiology", "digital", "transport"];
    pal.hues.forEach((h, i) => r.setProperty(`--h-${ln[i]}`, h));
    r.setProperty("--h-primary", pal.primary);
    const f = FONTS[t.font] || FONTS.Editorial;
    r.setProperty("--font-body", f.body);
    r.setProperty("--font-mono", f.mono);
    r.setProperty("--d", DENSITY[t.density] || 1);
  }, [t.palette, t.font, t.density]);

  // ---- scroll-spy ----
  const flowRef = useRef(null);
  const mflowRef = useRef(null);
  const mPosRef = useRef([]);
  const geoRef = useRef({ top: 0, colLeft: 120, right: 900 });
  const [geo, setGeo] = useState({ colLeft: 120, right: 900 });
  const [spy, setSpy] = useState({ day: firstDay, visible: false });
  const LINE = 0.46;

  const measureMobilePositions = useCallback(() => {
    const flow = mflowRef.current;if (!flow) return;
    const rows = [...flow.querySelectorAll("[data-day]")];
    mPosRef.current = rows.map((el) => {
      const r = el.getBoundingClientRect();
      return {
        day: +el.dataset.day,
        endDay: el.dataset.endDay ? +el.dataset.endDay : +el.dataset.day,
        type: el.dataset.type,
        top: r.top + window.scrollY,
        bottom: r.bottom + window.scrollY
      };
    }).sort((a, b) => a.top - b.top);
  }, []);

  const recompute = useCallback(() => {
    if (isMobile) {
      measureMobilePositions();
      const m = 16;
      const w = window.innerWidth;
      setGeo((g) => g.colLeft === m && g.right === w - m ? g : { colLeft: m, right: w - m });
      const flow = mflowRef.current;
      if (flow) {const fr = flow.getBoundingClientRect();geoRef.current = { top: fr.top + window.scrollY, colLeft: m, right: w - m };}
      return;
    }
    const flow = flowRef.current;if (!flow) return;
    const fr = flow.getBoundingClientRect();
    const railW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rail-w")) || 72;
    geoRef.current = { top: fr.top + window.scrollY, colLeft: fr.left + railW, right: fr.right };
    setGeo((g) => g.colLeft === fr.left + railW && g.right === fr.right ? g : { colLeft: fr.left + railW, right: fr.right });
  }, [isMobile, measureMobilePositions]);

  const measure = useCallback(() => {
    const lineDoc = window.scrollY + window.innerHeight * LINE;
    if (isMobile) {
      const arr = mPosRef.current;
      const flow = mflowRef.current;
      if (!arr.length || !flow) {setSpy((p) => p.visible ? { ...p, visible: false } : p);return;}
      let cur = arr[0];
      for (const row of arr) {if (lineDoc >= row.top) cur = row;else break;}
      let day = cur.day;
      if (cur.type === "band" && cur.bottom > cur.top) {
        const frac = Math.max(0, Math.min(1, (lineDoc - cur.top) / (cur.bottom - cur.top)));
        day = cur.day + frac * (cur.endDay + 1 - cur.day);
      }
      day = Math.max(firstDay, Math.min(lastDay, day));
      const fr = flow.getBoundingClientRect();
      const visible = fr.top < window.innerHeight * LINE && fr.bottom > window.innerHeight * LINE + 10;
      setSpy((prev) => Math.abs(prev.day - day) < 0.05 && prev.visible === visible ? prev : { day, visible });
      return;
    }
    const { top } = geoRef.current;
    let day = firstDay + (lineDoc - top - PAD) / UNIT;
    day = Math.max(firstDay, Math.min(lastDay, day));
    const fr = flowRef.current && flowRef.current.getBoundingClientRect();
    const visible = fr ? fr.top < window.innerHeight * LINE && fr.bottom > window.innerHeight * LINE + 10 : false;
    setSpy((prev) => Math.abs(prev.day - day) < 0.08 && prev.visible === visible ? prev : { day, visible });
  }, [isMobile, firstDay, lastDay]);

  const scrollToDay = useCallback((target, smooth) => {
    if (isMobile) {
      const arr = mPosRef.current;if (!arr.length) return;
      let row = arr.find((r) => target >= r.day && target <= r.endDay);
      if (!row) row = arr.reduce((best, r) => Math.abs(r.day - target) < Math.abs(best.day - target) ? r : best, arr[0]);
      let docY = row.top;
      if (row.type === "band" && row.endDay > row.day) {
        const frac = (target - row.day) / (row.endDay + 1 - row.day);
        docY = row.top + frac * (row.bottom - row.top);
      }
      window.scrollTo({ top: docY - window.innerHeight * LINE, behavior: smooth ? "smooth" : "auto" });
      return;
    }
    const { top } = geoRef.current;
    const docY = top + PAD + (target - firstDay) * UNIT;
    window.scrollTo({ top: docY - window.innerHeight * LINE, behavior: smooth ? "smooth" : "auto" });
  }, [isMobile, firstDay]);

  useLayoutEffect(() => {recompute();measure();}, [t.density, t.font, isMobile, recompute, measure]);
  useEffect(() => {
    let raf = 0;
    const onScroll = () => {if (raf) return;raf = requestAnimationFrame(() => {raf = 0;measure();});};
    const onResize = () => {recompute();measure();};
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onResize);
    const ro = new ResizeObserver(() => {recompute();measure();});
    if (document.body) ro.observe(document.body);
    const t1 = setTimeout(() => {recompute();measure();}, 350);
    const t2 = setTimeout(() => {recompute();measure();}, 900);
    recompute();measure();
    return () => {window.removeEventListener("scroll", onScroll);window.removeEventListener("resize", onResize);ro.disconnect();clearTimeout(t1);clearTimeout(t2);};
  }, [recompute, measure]);

  // ---- derive lit/statuses ----
  const dayCont = spy.day;
  const sliderDay = Math.round(dayCont);
  const nearEvent = evDays.reduce((best, d) => Math.abs(d - dayCont) < Math.abs(best - dayCont) ? d : best, evDays[0]);
  const activeBand = BANDS.find((b) => dayCont >= b.start && dayCont < b.end + 1);
  const litDay = activeBand ? null : nearEvent;

  const slotStatus = (d) => litDay != null ?
  d < litDay ? "past" : d === litDay ? "now" : "future" :
  d < dayCont ? "past" : "future";
  const railStatus = (d) => litDay != null && d === litDay ? "now" : d < dayCont ? "past" : "future";
  const bandStatus = (b) => dayCont >= b.end + 1 ? "past" : dayCont < b.start ? "future" : "now";

  // ---- filters ----
  const toggleLane = (id) => setActiveLanes((prev) => {
    const n = new Set(prev);
    if (n.size === LANES.length) return new Set([id]);
    if (n.has(id)) n.delete(id);else n.add(id);
    if (n.size === 0) return new Set(LANES.map((l) => l.id));
    return n;
  });
  const allOn = activeLanes.size === LANES.length;
  const fill = (sliderDay - 1) / (TOTAL_DAYS - 1) * 100;

  return (
    <div className="app">
      {/* HERO */}
      <header className="hero">
        {copy.kicker ? <p className="kicker mono">{copy.kicker}</p> : null}
        <h1>So you need<br /><em>radiology?</em></h1>
        <p className="sub">{copy.sub}</p>
        <div className="meta">
          <div className="metric"><div className="n mono">94</div><div className="l">days, start to finish</div></div>
          <div className="metric"><div className="n mono">38</div><div className="l">days before the first visit</div></div>
          <div className="metric"><div className="n mono">6</div><div className="l">parties involved</div></div>
        </div>
        <p className="howto">
          <em>Imagine <b>you are 19 years old</b> and in your second year of university. Fond of running, you often jog each
          morning before your classes. However, <b>you've recently started feeling a sharp pain in your right shin</b> as you
          begin your run, leaving you limping when you walk the rest of the day. <b>The pain quickly worsens and you know it
          is time to seek medical help.</b></em>
          <br /><br />
          <b>Scroll through the timeline</b> to move along the journey.

          <b> Tap or hover any event</b> to read what's happening, and use the
          <b> filters up top</b> to focus on who's involved.
          <br /><a href="#references" className="reflink" onClick={(e) => {e.preventDefault();const el = document.getElementById("references");if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" });}}>Timeline based on national averages — see references ↓</a>
        </p>
      </header>

      {/* STAGE */}
      <div className="stage">
        <div className="tl">
          {/* sticky filter headers, one per column */}
          <div className="colhead">
            <div className="ch-rail">{!allOn && <button className="ch-all" onClick={() => setActiveLanes(new Set(LANES.map((l) => l.id)))}>Show<br />all</button>}</div>
            {LANES.map((lane) =>
            <button key={lane.id} className={`colchip ${lane.cls} ${activeLanes.has(lane.id) ? "" : "off"}`} onClick={() => toggleLane(lane.id)}>
                <span className="dot"></span>{lane.name}
              </button>
            )}
          </div>

          <div className="flow" ref={flowRef} style={{ height: flowH, display: isMobile ? "none" : "grid" }}>
            <div className="tracks">
              <div></div>
              {LANES.map((l) => <div className="trk" key={l.id}></div>)}
            </div>

            {/* rail: day numbers + waiting-range labels */}
            <div className="railcol">
              {evDays.map((d) =>
              <div key={"d" + d} className={`rday ${railStatus(d)}`} style={{ top: y(d) }}>
                  <span className="dnum mono">DAY {d}</span>
                </div>
              )}
              {BANDS.map((b, i) =>
              <div key={"r" + i} className="rrange mono" style={{ top: PAD + ((b.start + b.end + 1) / 2 - firstDay) * UNIT - 7 }}>
                  DAY {b.start}{b.end > b.start ? `–${b.end}` : ""}
                </div>
              )}
            </div>

            {/* lane columns */}
            {LANES.map((lane, li) => {
              const side = li >= 3 ? "right" : "left";
              const on = activeLanes.has(lane.id);
              return (
                <div className={`lanecol ${lane.cls}`} key={lane.id}>
                  {bandsByLane[lane.id].map((b, i) => {
                    const dn = b.end - b.start + 1;
                    return (
                      <div key={"b" + i} className={`band-abs is-${bandStatus(b)}`} style={{ top: y(b.start), height: dn * UNIT }}>
                        <div className={`band ${dn <= 5 ? "compact" : ""} ${on ? "" : "dimmed"}`}>
                          <div className="bdays">{dn} {dn === 1 ? "day" : "days"} pass</div>
                          <div className="blabel">{b.label}</div>
                          {b.note && dn >= 4 && <div className="bnote">{b.note}</div>}
                          {b.tip && dn >= 9 &&
                          <div className="btip"><span className="bk">While you wait</span><span className="bx">{b.tip}</span></div>}
                        </div>
                      </div>);
                  })}
                  {slots[lane.id].map((s, i) =>
                  <div key={"s" + i} className={`slot is-${slotStatus(s.day)}`} style={{ top: y(s.day) }}>
                      {s.events.map((ev, j) =>
                    <EventCard key={j} ev={ev} side={side} active={on} lit={litDay != null && s.day === litDay} />
                    )}
                    </div>
                  )}
                </div>);
            })}
          </div>

          {/* mobile: single chronological column */}
          <div className="mflow" ref={mflowRef} style={{ display: isMobile ? "block" : "none" }}>
            {mRows.map((row) => {
              if (row.type === "day") {
                const st = slotStatus(row.day);
                return (
                  <div className="mrow" data-day={row.day} data-type="day" key={row.key}>
                    <div className={`mday mono ${railStatus(row.day)}`}>DAY {row.day}</div>
                    <div className={`slot is-${st}`}>
                      {row.events.map((ev, j) =>
                      <EventCard key={j} ev={ev} side="left" active={activeLanes.has(ev.lane)} lit={litDay != null && row.day === litDay} />
                      )}
                    </div>
                  </div>);
              }
              const b = row.band,dn = b.end - b.start + 1,on = activeLanes.has(b.lane),lane = laneById[b.lane];
              const h = Math.max(116, Math.min(248, dn * 7));
              return (
                <div className="mrow mrow-band" data-day={b.start} data-end-day={b.end} data-type="band" key={row.key}>
                  <div className="mday mono">DAY {b.start}{b.end > b.start ? `–${b.end}` : ""}</div>
                  <div className={`band-abs is-${bandStatus(b)} ${lane.cls}`} style={{ height: h }}>
                    <div className={`band ${dn <= 5 ? "compact" : ""} ${on ? "" : "dimmed"}`}>
                      <div className="mband-lane"><span className="dot"></span>{lane.name}</div>
                      <div className="bdays">{dn} {dn === 1 ? "day" : "days"} pass</div>
                      <div className="blabel">{b.label}</div>
                      {b.note && <div className="bnote">{b.note}</div>}
                      {b.tip && dn >= 9 &&
                      <div className="btip"><span className="bk">While you wait</span><span className="bx">{b.tip}</span></div>}
                    </div>
                  </div>
                </div>);
            })}
          </div>
        </div>

        <aside className="aside">
          <Checklist currentDay={Math.max(1, Math.floor(dayCont))} activeDay={litDay} copy={copy} onJump={(d) => scrollToDay(d, true)} />
        </aside>
      </div>

      {/* CARE PLAN — paying the bill */}
      <section className="careplan">
        <h2>Paying <em>the bill</em></h2>
        <p className="cp-lede">
          The timeline ends, but your part doesn't. Here's how to close out the cost without overpaying.
        </p>
        <ul className="cp-list">
          <li>Check the bill against your <b>explanation of benefits (EOB)</b> first. Request an <b>itemized bill</b> and make sure you're not charged for anything insurance already covered.</li>
          <li>Ask the billing office about an <b>interest-free payment plan</b>, a <b>prompt-pay discount</b>, or <b>financial assistance / charity care</b> (many offer it but rarely advertise it).</li>
          <li><b>Dispute errors</b>: appeal denials with your insurer in writing, and use the <b>No Surprises Act</b> for unexpected out-of-network charges.</li>
          <li>Don't ignore it! Unpaid balances can go to <b>collections</b> after roughly 60–120 days; you generally have a one-year grace period before most medical debt can appear on your credit report.</li>
        </ul>
        <p className="cp-note">
          Not medical or financial advice — talk to your provider and your insurer about what's right for you. Rules on
          medical debt and credit reporting vary by state and change over time.
        </p>
      </section>

      {/* LOOKING TO THE FUTURE */}
      <section className="careplan">
        <h2>Looking to <em>the future</em></h2>
        <p className="cp-lede">
          This timeline reveals where the system strains. Here's what's worth changing and what a future version could look like.
        </p>
        <ul className="cp-list">
          <li><b>The wait is too long.</b> On this timeline, it takes roughly <b>40 days</b> just to be seen by a physician, before any imaging is ordered or any diagnosis is made. Long appointment wait times are a structural bottleneck that delays care for everyone.</li>
          <li><b>Prior authorization is a gate, not a guardrail.</b> Insurers require physicians to seek approval before ordering imaging. In practice, this adds days of paperwork and sometimes overrides clinical judgment, consequently slowing down the process even when the need is clear.</li>
          <li><b>Society is used to only imaging when something is already wrong.</b> The current model is reactive: symptoms appear, a physician orders imaging, and an investigation follows. By the time imaging happens, a problem has often been developing for months or years undetected.</li>
        </ul>
        <p className="cp-lede" style={{ marginTop: "28px" }}>
          A different approach is possible...
        </p>
        <ul className="cp-list">
          <li><b>Routine whole-body imaging as a standard of care.</b> Just as cars receive periodic full inspections—checking every system before something fails—people could receive baseline scans on a regular schedule, establishing what's normal and surfacing anomalies early, when they're most treatable.</li>
          <li><b>Proactive, preventative care instead of reactive response.</b> Shifting imaging upstream changes the role of radiology from a diagnostic tool to an early-warning system, giving patients and physicians time to act.</li>
        </ul>
        <p className="cp-note">
          Not medical advice. The future of radiology is still being written by researchers, policymakers, patients, and clinicians working together.
        </p>
      </section>

      {/* references */}
      <section id="references" className="refs">
        <div className="refs-head">
          <span className="refs-k mono">References</span>
          <h2>How this timeline was built</h2>
          <p className="refs-intro">
            Day counts reflect national averages drawn from the sources below. Your own experience will vary with your plan,
            your providers, and how busy they are. This is an orientation tool, not medical or scheduling advice.
          </p>
        </div>
        <ol className="reflist">
          {REFERENCES.map((r, i) =>
          <li key={i} className="refitem">
              <span className="refnum mono">{String(i + 1).padStart(2, "0")}</span>
              <div className="refbody">
                <a className="reftitle" href={r.url} target="_blank" rel="noopener noreferrer">{r.title} <span className="refext">↗</span></a>
                <div className="refsrc">{r.source}{r.year ? ` · ${r.year}` : ""}</div>
              </div>
            </li>
          )}
        </ol>
      </section>

      {/* fixed left scrubber (day 1 → day 89) */}
      <div className="scrollrail">
        <div className="sr-cap">Day 1</div>
        <div className="sr-track">
          <input type="range" min="1" max={TOTAL_DAYS} value={sliderDay} style={{ "--fill": fill + "%" }}
          onChange={(e) => scrollToDay(+e.target.value)} aria-label="Scrub through the journey" />
        </div>
        <div className="sr-cap">Day {TOTAL_DAYS}</div>
      </div>

      {/* always-visible you-are-here line (spans the timeline only) */}
      <div className={`hereline ${spy.visible ? "on" : ""}`}>
        <div className="hl-line" style={{ left: geo.colLeft, width: Math.max(0, geo.right - geo.colLeft) }}></div>
        <div className="hl-tag" style={{ right: Math.max(8, (typeof window !== "undefined" ? window.innerWidth : 1200) - geo.colLeft) }}>
          <span className="k">You are here</span><span className="d">Day {sliderDay}</span>
        </div>
      </div>

      <TweaksUI t={t} setTweak={setTweak} />
    </div>);
}
